<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Fortune City - 포춘시티 가치 투자 도시 게임</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for React JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; background-color: #e0f2fe; color: #0f172a; overflow-x: hidden; }
        .font-jua { font-family: 'Jua', sans-serif; }
        .font-nunito { font-family: 'Nunito', sans-serif; }

        /* Official Fortune City Soft Sky & Grass Pastel Aesthetics */
        .fortune-header {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.25);
        }

        .city-metropolis-map {
            background: radial-gradient(circle, #e0f2fe 0%, #bae6fd 60%, #7dd3fc 100%);
            border: 4px solid #38bdf8;
            box-shadow: inset 0 0 30px rgba(2, 132, 199, 0.15);
        }

        .building-card {
            background: #ffffff;
            border: 2px solid #bae6fd;
            box-shadow: 0 8px 20px -4px rgba(2, 132, 199, 0.12);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .building-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 14px 28px -6px rgba(2, 132, 199, 0.2);
            border-color: #0284c7;
        }

        .building-pop {
            animation: fortunePop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fortunePop {
            0% { transform: scale(0.4) translateY(30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .fab-button {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4), 0 0 0 4px rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body class="min-h-screen pb-28 selection:bg-sky-900 selection:text-white">

    <!-- React App Root Container -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Official Fortune City Game Simulation Platform ---
        function App() {
            // Mayor & Fortune City Financial Stats
            const [mayor, setMayor] = useState({
                name: '스마트개미 시장님',
                avatar: '🎩',
                cityLevel: 6,
                population: 1850,
                gold: 1250000,
                gems: 340,
                streak: 7
            });

            // 100+ Styles Fortune City Buildings Database
            const [buildings, setBuildings] = useState([
                { id: 1, name: '🏢 삼성 주식 타워', symbol: '$삼성전자', type: '주식', level: 3, pnl: 8.5, icon: '🏢', cfo: '🐱 냥이 CFO', cfoStatus: '근무 중', bg: 'bg-sky-50 border-sky-200' },
                { id: 2, name: '🪙 비트코인 뱅크', symbol: '$BTC', type: '코인', level: 2, pnl: 12.4, icon: '🪙', cfo: '🦊 여우 분석가', cfoStatus: '근무 중', bg: 'bg-amber-50 border-amber-200' },
                { id: 3, name: '🏰 가치 중앙 시청', symbol: '시티본부', type: '시청', level: 5, pnl: 18.5, icon: '🏰', cfo: '🎩 스마트개미', cfoStatus: '총괄 중', bg: 'bg-emerald-50 border-emerald-200' },
                { id: 4, name: '⚡ 엔비디아 AI 랩', symbol: '$NVDA', type: '주식', level: 2, pnl: 15.2, icon: '⚡', cfo: '🐶 멍멍 매니저', cfoStatus: '근무 중', bg: 'bg-indigo-50 border-indigo-200' },
                { id: 5, name: '🌳 수익 공원', symbol: '$TSLA', type: '정원', level: 1, pnl: 4.2, icon: '🌳', cfo: '🐰 토끼 매니저', cfoStatus: '휴식 중', bg: 'bg-green-50 border-green-200' }
            ]);

            // Citizens / CFO Character Roster
            const [citizens, setCitizens] = useState([
                { id: 1, name: '🐱 냥이 CFO', job: '🏢 삼성 주식 타워', efficiency: '수익률 +2.5% 보너스', level: 3 },
                { id: 2, name: '🦊 여우 분석가', job: '🪙 비트코인 뱅크', efficiency: '코인 김프 감지 보너스', level: 2 },
                { id: 3, name: '🐶 멍멍 매니저', job: '⚡ 엔비디아 AI 랩', efficiency: 'AI 기술주 분석 보너스', level: 2 },
                { id: 4, name: '🐰 토끼 매니저', job: '미배치', efficiency: '일일 골드 +10,000원 생성', level: 1 }
            ]);

            const [activeTab, setActiveTab] = useState('city'); // 'city', 'citizens', 'analytics', 'friends'
            const [constructModalOpen, setConstructModalOpen] = useState(false);
            const [selectedBuilding, setSelectedBuilding] = useState(null);
            const [profileModalOpen, setProfileModalOpen] = useState(false);

            // Natural Language Construction Input
            const [promptText, setPromptText] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('📈 주식');

            // Handle Record & Construct Fortune City Building
            const handleConstructBuilding = (e) => {
                e.preventDefault();
                if (!promptText.trim()) return;

                const text = promptText.trim();
                const detectedSymbol = text.includes('삼성') ? '$삼성전자' : text.includes('비트') ? '$BTC' : text.includes('솔라') ? '$SOL' : '$NVDA';
                const buildingName = detectedSymbol === '$삼성전자' ? '🏢 삼성 주식 타워' : detectedSymbol === '$BTC' ? '🪙 비트코인 뱅크' : '⚡ 엔비디아 AI 랩';

                const newBuilding = {
                    id: Date.now(),
                    name: `${buildingName} Lv.1`,
                    symbol: detectedSymbol,
                    type: selectedCategory === '📈 주식' ? '주식' : '코인',
                    level: 1,
                    pnl: 7.2,
                    icon: selectedCategory === '📈 주식' ? '🏢' : '🪙',
                    cfo: '🐰 토끼 매니저',
                    cfoStatus: '근무 중',
                    bg: selectedCategory === '📈 주식' ? 'bg-sky-50 border-sky-200' : 'bg-amber-50 border-amber-200'
                };

                setBuildings(prev => [newBuilding, ...prev]);
                setMayor(prev => ({
                    ...prev,
                    population: prev.population + 120,
                    gold: prev.gold + 100000,
                    streak: prev.streak + 1
                }));

                setPromptText('');
                setConstructModalOpen(false);
            };

            const handleMergeBuildings = (bId) => {
                setBuildings(prev => prev.map(b => b.id === bId ? { ...b, level: b.level + 1, name: b.name.replace(/Lv\.\d+/, `Lv.${b.level + 1}`) } : b));
                setSelectedBuilding(null);
                alert('🎉 건물 합성 성공! 건물 레벨이 증축되었습니다!');
            };

            return (
                <div className="min-h-screen">
                    {/* Top Fortune City Dashboard Navigation */}
                    <header className="fortune-header text-white px-4 md:px-8 py-3.5 sticky top-0 z-50 font-jua flex justify-between items-center">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-2xl bg-white/20 backdrop-blur-md flex justify-center items-center font-bold text-xl shadow-inner">
                                🏛️
                            </div>
                            <div>
                                <span className="font-black text-xl tracking-tight">Fortune City <span className="text-xs bg-white/20 px-2 py-0.5 rounded-full">포춘시티</span></span>
                            </div>
                        </div>

                        {/* City Financial Stats Meters */}
                        <div className="flex items-center gap-2.5 text-xs">
                            <div className="flex items-center gap-1 bg-black/20 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/10 text-amber-300 font-mono">
                                <span>🪙</span>
                                <span className="font-bold">{mayor.gold.toLocaleString()}원</span>
                            </div>
                            <div className="hidden sm:flex items-center gap-1 bg-black/20 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/10 text-sky-200 font-mono">
                                <span>💎</span>
                                <span className="font-bold">{mayor.gems}</span>
                            </div>
                            <div className="flex items-center gap-1 bg-amber-400 text-slate-900 px-3 py-1.5 rounded-xl font-bold">
                                <span>🔥 {mayor.streak}일</span>
                            </div>
                            <button onClick={() => setProfileModalOpen(true)} className="bg-white text-slate-900 font-bold px-3 py-1.5 rounded-xl shadow-md hover:bg-slate-100 transition flex items-center gap-1">
                                <span className="text-sm">{mayor.avatar}</span>
                                <span className="hidden md:inline">{mayor.name}</span>
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="max-w-3xl mx-auto px-4 pt-5 space-y-5 font-jua">

                        {/* Top View Selector Tabs */}
                        <div className="flex justify-center text-sm">
                            <div className="bg-white p-1.5 rounded-2xl shadow-sm border border-sky-200 flex gap-2">
                                <button onClick={() => setActiveTab('city')} className={activeTab === 'city' ? 'bg-sky-600 text-white px-4 py-2 rounded-xl font-bold transition shadow-sm' : 'text-slate-600 hover:bg-slate-100 px-4 py-2 rounded-xl font-bold transition'}>
                                    🏙️ 도시 전경 ({buildings.length})
                                </button>
                                <button onClick={() => setActiveTab('citizens')} className={activeTab === 'citizens' ? 'bg-sky-600 text-white px-4 py-2 rounded-xl font-bold transition shadow-sm' : 'text-slate-600 hover:bg-slate-100 px-4 py-2 rounded-xl font-bold transition'}>
                                    👥 CFO 시민 관리 ({citizens.length})
                                </button>
                                <button onClick={() => setActiveTab('friends')} className={activeTab === 'friends' ? 'bg-sky-600 text-white px-4 py-2 rounded-xl font-bold transition shadow-sm' : 'text-slate-600 hover:bg-slate-100 px-4 py-2 rounded-xl font-bold transition'}>
                                    🏆 친구 도시 랭킹
                                </button>
                            </div>
                        </div>

                        {/* TAB 1: Authentic Fortune City Metropolis Building Grid */}
                        {activeTab === 'city' && (
                            <div className="city-metropolis-map p-6 rounded-3xl space-y-4">
                                <div className="flex justify-between items-center text-xs">
                                    <div className="flex items-center gap-2">
                                        <span className="bg-slate-900 text-sky-300 px-3.5 py-1 rounded-full font-bold">🌳 {mayor.name}의 가치 대도시</span>
                                        <span className="text-sky-900 font-bold">시티 레벨: Lv.{mayor.cityLevel}</span>
                                    </div>
                                    <span className="text-sky-900 font-bold">시민 수: {mayor.population.toLocaleString()}명</span>
                                </div>

                                {/* Building Cards Grid */}
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 pt-2">
                                    {buildings.map(b => (
                                        <div
                                            key={b.id}
                                            onClick={() => setSelectedBuilding(b)}
                                            className={`building-card ${b.bg} p-4 rounded-3xl cursor-pointer building-pop space-y-2 relative overflow-hidden`}
                                        >
                                            <div className="flex justify-between items-start">
                                                <span className="text-3xl filter drop-shadow-md">{b.icon}</span>
                                                <span className="bg-slate-900 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">Lv.{b.level}</span>
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-slate-900 text-sm">{b.name}</h3>
                                                <span className="text-sky-800 text-[11px] font-bold">{b.symbol} · {b.type}</span>
                                            </div>
                                            <div className="text-[11px] text-slate-600 bg-white/70 px-2 py-1 rounded-lg border border-slate-200">
                                                <span>CFO: </span>
                                                <span className="font-bold text-slate-900">{b.cfo}</span>
                                            </div>
                                            <div className="flex justify-between items-center pt-1 border-t border-slate-200 text-xs">
                                                <span className="text-slate-400 text-[10px]">수익률</span>
                                                <span className={b.pnl >= 0 ? 'text-emerald-600 font-black font-mono' : 'text-rose-600 font-black font-mono'}>
                                                    {b.pnl >= 0 ? `+${b.pnl}%` : `${b.pnl}%`}
                                                </span>
                                            </div>
                                        </div>
                                    ))}

                                    {/* Empty Tile to Construct */}
                                    <div
                                        onClick={() => setConstructModalOpen(true)}
                                        className="building-card bg-white/50 border-2 border-dashed border-sky-400 p-4 rounded-3xl cursor-pointer flex flex-col justify-center items-center text-center space-y-1 py-8 hover:bg-white transition"
                                    >
                                        <div className="w-10 h-10 rounded-full bg-sky-500 text-white flex justify-center items-center text-lg font-bold shadow-md">
                                            <i className="fa-solid fa-plus"></i>
                                        </div>
                                        <span className="text-xs font-bold text-sky-900">새 건물 건축</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: Citizens & CFO Job Assignment Roster */}
                        {activeTab === 'citizens' && (
                            <div className="bg-white p-5 rounded-3xl border border-slate-200 space-y-4 text-xs">
                                <h3 className="font-bold text-slate-900 text-sm border-b border-slate-100 pb-2">👥 CFO 시민 채용 & 건물 배치 관리</h3>
                                <div className="space-y-3">
                                    {citizens.map(c => (
                                        <div key={c.id} className="p-3.5 bg-sky-50 rounded-2xl border border-sky-200 flex justify-between items-center">
                                            <div className="flex items-center gap-3">
                                                <span className="text-2xl">{c.name.split(' ')[0]}</span>
                                                <div>
                                                    <span className="font-bold text-slate-900 text-sm block">{c.name}</span>
                                                    <span className="text-sky-800 text-[11px]">배치 건물: {c.job}</span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <span className="bg-emerald-600 text-white px-2.5 py-1 rounded-full font-bold text-[10px]">{c.efficiency}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 3: Friends Metropolis Ranking */}
                        {activeTab === 'friends' && (
                            <div className="bg-white p-5 rounded-3xl border border-slate-200 space-y-3 text-xs">
                                <h3 className="font-bold text-slate-900 text-sm border-b border-slate-100 pb-2">🏆 친구 포춘 대도시 랭킹</h3>
                                <div className="space-y-3">
                                    <div className="p-3.5 bg-amber-50 rounded-2xl border border-amber-200 flex justify-between items-center">
                                        <div className="flex items-center gap-3">
                                            <span className="font-black text-amber-700 text-base">1위</span>
                                            <span className="text-2xl">🎩</span>
                                            <div>
                                                <span className="font-bold text-slate-900 text-sm">{mayor.name}</span>
                                                <span className="text-slate-500 text-[11px] block">🏢 건물 {buildings.length}개 · 👥 인구 {mayor.population.toLocaleString()}명</span>
                                            </div>
                                        </div>
                                        <span className="text-emerald-600 font-mono font-black text-sm">+18.5%</span>
                                    </div>
                                    <div className="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 flex justify-between items-center">
                                        <div className="flex items-center gap-3">
                                            <span className="font-black text-slate-500 text-base">2위</span>
                                            <span className="text-2xl">🐱</span>
                                            <div>
                                                <span className="font-bold text-slate-900 text-sm">박비트 시장님</span>
                                                <span className="text-slate-500 text-[11px] block">🪙 건물 4개 · 👥 인구 1,200명</span>
                                            </div>
                                        </div>
                                        <span className="text-emerald-600 font-mono font-black text-sm">+12.4%</span>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Floating Bottom Action Bar (Official Fortune City FAB) */}
                    <div className="fixed bottom-5 left-0 right-0 z-40 flex justify-center items-center px-4 font-jua">
                        <div className="bg-slate-900/95 backdrop-blur-md text-white px-6 py-3 rounded-full shadow-2xl border border-slate-800 flex items-center gap-6">
                            <button onClick={() => setActiveTab('city')} className={activeTab === 'city' ? 'text-sky-300 font-bold flex flex-col items-center text-xs' : 'text-slate-400 hover:text-white flex flex-col items-center text-xs'}>
                                <i className="fa-solid fa-city text-base"></i>
                                <span className="mt-0.5">도시 전경</span>
                            </button>

                            {/* Main Construction FAB Button */}
                            <button
                                onClick={() => setConstructModalOpen(true)}
                                className="fab-button text-white font-black px-6 py-3 rounded-2xl text-sm flex items-center gap-2 hover:scale-105 active:scale-95 transition"
                            >
                                <i className="fa-solid fa-hammer text-base"></i>
                                <span>기록하고 건축하기</span>
                            </button>

                            <button onClick={() => setActiveTab('citizens')} className={activeTab === 'citizens' ? 'text-sky-300 font-bold flex flex-col items-center text-xs' : 'text-slate-400 hover:text-white flex flex-col items-center text-xs'}>
                                <i className="fa-solid fa-users text-base"></i>
                                <span className="mt-0.5">CFO 시민</span>
                            </button>
                        </div>
                    </div>

                    {/* Construction Modal */}
                    {constructModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border border-slate-200">
                                <button onClick={() => setConstructModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <div>
                                    <h3 className="text-lg font-black text-slate-900">🔨 기록하고 건물 건축하기</h3>
                                    <p className="text-xs text-slate-500">매매를 작성하면 포춘시티 대도시 타일에 건물이 건축됩니다.</p>
                                </div>

                                <div className="flex gap-2 text-xs">
                                    <button type="button" onClick={() => setSelectedCategory('📈 주식')} className={selectedCategory === '📈 주식' ? 'bg-sky-600 text-white px-3 py-1.5 rounded-xl font-bold' : 'bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl font-bold'}>
                                        📈 주식 타워
                                    </button>
                                    <button type="button" onClick={() => setSelectedCategory('🪙 코인')} className={selectedCategory === '🪙 코인' ? 'bg-sky-600 text-white px-3 py-1.5 rounded-xl font-bold' : 'bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl font-bold'}>
                                        🪙 코인 뱅크
                                    </button>
                                </div>

                                <form onSubmit={handleConstructBuilding} className="space-y-3">
                                    <input
                                        type="text"
                                        value={promptText}
                                        onChange={(e) => setPromptText(e.target.value)}
                                        placeholder="예: '$삼성전자 100만원 매수' 또는 '$BTC 50만원 매수'..."
                                        required
                                        className="w-full bg-slate-50 text-slate-900 placeholder-slate-400 text-sm px-4 py-3.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-sky-500 border border-slate-200"
                                    />

                                    <div className="flex gap-2 text-xs">
                                        <button type="button" onClick={() => setPromptText('$삼성전자 100만원 매수했어')} className="bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1.5 rounded-xl text-[11px]">
                                            📈 "$삼성전자 100만원 매수"
                                        </button>
                                        <button type="button" onClick={() => setPromptText('$BTC 50만원 매수했어')} className="bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1.5 rounded-xl text-[11px]">
                                            🪙 "$BTC 50만원 매수"
                                        </button>
                                    </div>

                                    <button type="submit" className="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3.5 rounded-2xl shadow-md text-xs transition">
                                        도시 타일에 건축 완료하기
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Building Merge / Level Up Inspector Modal */}
                    {selectedBuilding && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-center relative border border-slate-200">
                                <button onClick={() => setSelectedBuilding(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <div className="text-4xl py-2">{selectedBuilding.icon}</div>
                                <div>
                                    <h3 className="text-lg font-black text-slate-900">{selectedBuilding.name}</h3>
                                    <span className="text-xs text-slate-500 font-bold">{selectedBuilding.symbol} · 레벨 Lv.{selectedBuilding.level}</span>
                                </div>
                                <div className="p-3 bg-sky-50 text-sky-900 rounded-2xl text-xs font-bold border border-sky-200">
                                    담당 CFO: <span className="text-slate-900">{selectedBuilding.cfo}</span> ({selectedBuilding.cfoStatus})
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => handleMergeBuildings(selectedBuilding.id)} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-2xl text-xs shadow-md">
                                        ⬆️ 건물 증축 (레벨업)
                                    </button>
                                    <button onClick={() => setSelectedBuilding(null)} className="w-full bg-slate-900 text-white font-bold py-3 rounded-2xl text-xs">
                                        닫기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Mayor Profile Modal */}
                    {profileModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border border-slate-200">
                                <button onClick={() => setProfileModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="text-lg font-black text-slate-900">👤 시장님 프로필 설정</h3>
                                <form onSubmit={(e) => { e.preventDefault(); setProfileModalOpen(false); }} className="space-y-3 text-xs">
                                    <div>
                                        <label className="text-slate-600 block mb-1 font-bold">시장 닉네임</label>
                                        <input type="text" value={mayor.name} onChange={(e) => setMayor(prev => ({ ...prev, name: e.target.value }))} required className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl" />
                                    </div>
                                    <button type="submit" className="w-full bg-slate-900 text-white font-bold py-3 rounded-2xl text-xs">
                                        저장하기
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
