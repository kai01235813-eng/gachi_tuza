<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>같이투자 (Gachi Tuza) - 포춘빌리지 소셜 가치투자</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for React JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap');
        body {
            font-family: 'Jua', 'Gowun Dodum', sans-serif;
            margin: 0; padding: 0;
            background-color: #fdf6e9;
            background-image: radial-gradient(#f0e2c8 1.3px, transparent 1.3px);
            background-size: 24px 24px;
            color: #5b4432;
        }
        .font-body { font-family: 'Gowun Dodum', sans-serif; }

        .card-cute { background: #fffdf7; border: 2px solid #ecd9b8; box-shadow: 0 5px 0 #f0e4cb; border-radius: 26px; }
        .card-deep { background: #fffdf7; border: 2.5px solid #e3cda4; box-shadow: 0 7px 0 #ecdcbd; border-radius: 28px; }

        .btn3d { border: 2.5px solid #5b4432; box-shadow: 0 4px 0 #5b4432; transition: transform .08s ease, box-shadow .08s ease; }
        .btn3d:active { transform: translateY(4px); box-shadow: 0 0 0 #5b4432; }

        @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
        .floaty { animation: floaty 3.2s ease-in-out infinite; }
        .floaty-slow { animation: floaty 4.6s ease-in-out infinite; }

        @keyframes wiggle { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
        .wiggle { animation: wiggle 1.4s ease-in-out infinite; transform-origin: 50% 75%; }

        @keyframes popIn { 0%{transform:scale(0.4);opacity:0} 70%{transform:scale(1.06)} 100%{transform:scale(1);opacity:1} }
        .pop-in { animation: popIn 0.45s cubic-bezier(.34,1.56,.64,1) both; }

        @keyframes rainfall { 0%{transform:translateY(-12px);opacity:0} 15%{opacity:0.9} 100%{transform:translateY(150px);opacity:0} }
        .raindrop { position:absolute; top:0; width:4px; height:11px; border-radius:999px; background:#6fb7e8; animation: rainfall 1.6s linear infinite; pointer-events:none; }

        @keyframes dropfall { 0%{transform:translateY(0);opacity:0} 30%{opacity:1} 100%{transform:translateY(24px);opacity:0} }
        .svg-drop { transform-box: fill-box; transform-origin: center; animation: dropfall 1.4s ease-in infinite; }

        @keyframes twinkle { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:0.25; transform:scale(0.8)} }
        .twinkle { position:absolute; animation: twinkle 1.8s ease-in-out infinite; pointer-events:none; }

        @keyframes drift { 0%{transform:translateX(0)} 50%{transform:translateX(24px)} 100%{transform:translateX(0)} }
        .cloud-drift { animation: drift 9s ease-in-out infinite; }

        @keyframes walkAcross { 0%{left:-18%} 100%{left:112%} }
        .merchant { position:absolute; bottom:6px; animation: walkAcross 16s linear infinite; font-size:22px; pointer-events:none; white-space:nowrap; }

        @keyframes barGrow { from{width:0} }
        .bar-grow { animation: barGrow 0.8s ease-out both; }

        @keyframes toastUp { 0%{transform:translateY(18px);opacity:0} 100%{transform:translateY(0);opacity:1} }
        .toast-up { animation: toastUp 0.3s ease-out both; }

        .badge-locked { filter: grayscale(1); opacity: 0.38; }
        ::selection { background:#fde68a; }
        input, select, textarea { outline: none; }
    </style>
</head>
<body class="min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const INK = '#5b4432';

        // ================= 귀여운 SVG 게임 에셋 =================
        const Face = ({ x = 0, y = 0, scale = 1, mood = 'happy' }) => (
            <g transform={`translate(${x},${y}) scale(${scale})`}>
                <circle cx="-7" cy="0" r="2.1" fill={INK}/>
                <circle cx="7" cy="0" r="2.1" fill={INK}/>
                {mood === 'happy'
                    ? <path d="M -4 4.5 Q 0 8.5 4 4.5" stroke={INK} strokeWidth="1.9" fill="none" strokeLinecap="round"/>
                    : <path d="M -4 8 Q 0 4.5 4 8" stroke={INK} strokeWidth="1.9" fill="none" strokeLinecap="round"/>}
                <circle cx="-12" cy="3.5" r="2.8" fill="#f7a6b9" opacity="0.55"/>
                <circle cx="12" cy="3.5" r="2.8" fill="#f7a6b9" opacity="0.55"/>
            </g>
        );

        const SproutArt = () => (
            <g>
                <ellipse cx="50" cy="80" rx="24" ry="11" fill="#cfa06b" stroke={INK} strokeWidth="2.5"/>
                <path d="M50 72 Q49 58 50 50" stroke="#4c8a3f" strokeWidth="4.5" fill="none" strokeLinecap="round"/>
                <path d="M50 58 Q34 54 31 38 Q49 40 51 56 Z" fill="#7cc576" stroke={INK} strokeWidth="2.5" strokeLinejoin="round"/>
                <path d="M50 52 Q66 48 69 32 Q51 34 49 50 Z" fill="#9ad584" stroke={INK} strokeWidth="2.5" strokeLinejoin="round"/>
                <Face x={50} y={80} scale={0.75}/>
            </g>
        );

        const SaplingArt = () => (
            <g>
                <ellipse cx="50" cy="85" rx="19" ry="8" fill="#cfa06b" stroke={INK} strokeWidth="2.5"/>
                <path d="M50 82 L50 62" stroke="#8a6238" strokeWidth="5.5" strokeLinecap="round"/>
                <g fill="#7cc576" stroke={INK} strokeWidth="2.5">
                    <circle cx="36" cy="52" r="12"/><circle cx="64" cy="52" r="12"/><circle cx="50" cy="42" r="17"/>
                </g>
                <g fill="#7cc576">
                    <circle cx="36" cy="52" r="12"/><circle cx="64" cy="52" r="12"/><circle cx="50" cy="42" r="17"/>
                </g>
                <circle cx="42" cy="35" r="4.5" fill="#a5dd8d"/>
                <Face x={50} y={48} scale={0.85}/>
            </g>
        );

        const TreeArt = () => (
            <g>
                <rect x="44" y="58" width="12" height="27" rx="5" fill="#a97e4f" stroke={INK} strokeWidth="2.5"/>
                <g fill="#7cc576" stroke={INK} strokeWidth="2.5">
                    <circle cx="32" cy="46" r="15"/><circle cx="68" cy="46" r="15"/><circle cx="50" cy="31" r="18"/>
                </g>
                <g fill="#7cc576">
                    <circle cx="32" cy="46" r="15"/><circle cx="68" cy="46" r="15"/><circle cx="50" cy="31" r="18"/>
                </g>
                <circle cx="33" cy="40" r="3.2" fill="#f2645a"/>
                <circle cx="65" cy="50" r="3.2" fill="#f2645a"/>
                <circle cx="55" cy="24" r="3.2" fill="#f2645a"/>
                <circle cx="42" cy="24" r="4.5" fill="#a5dd8d"/>
                <Face x={50} y={44} scale={0.9}/>
            </g>
        );

        const HouseArt = () => (
            <g>
                <rect x="24" y="46" width="52" height="36" rx="7" fill="#fff4e0" stroke={INK} strokeWidth="2.5"/>
                <rect x="61" y="26" width="9" height="16" rx="3" fill="#cfa06b" stroke={INK} strokeWidth="2.5"/>
                <path d="M17 51 Q50 15 83 51 Z" fill="#f4977c" stroke={INK} strokeWidth="2.5" strokeLinejoin="round"/>
                <circle cx="38" cy="60" r="6" fill="#bfe3f7" stroke={INK} strokeWidth="2.5"/>
                <circle cx="62" cy="60" r="6" fill="#bfe3f7" stroke={INK} strokeWidth="2.5"/>
                <path d="M44 82 L44 75 Q50 68 56 75 L56 82 Z" fill="#8a6238" stroke={INK} strokeWidth="2.5" strokeLinejoin="round"/>
                <circle cx="29" cy="70" r="3" fill="#f7a6b9" opacity="0.6"/>
                <circle cx="71" cy="70" r="3" fill="#f7a6b9" opacity="0.6"/>
                <circle cx="21" cy="84" r="3.2" fill="#f7b733"/>
                <circle cx="79" cy="84" r="3.2" fill="#f79ab6"/>
            </g>
        );

        const ShopArt = () => (
            <g>
                <rect x="20" y="42" width="60" height="40" rx="7" fill="#fff4e0" stroke={INK} strokeWidth="2.5"/>
                <rect x="30" y="21" width="40" height="14" rx="7" fill="#f7b733" stroke={INK} strokeWidth="2.5"/>
                <circle cx="50" cy="28" r="3.4" fill="#fffdf7" stroke={INK} strokeWidth="1.8"/>
                <rect x="17" y="36" width="66" height="9" rx="4.5" fill="#f79ab6" stroke={INK} strokeWidth="2.5"/>
                {[0,1,2,3,4].map(i => (
                    <path key={i} d={`M${22 + i * 11.5} 45 a5.7 6.2 0 0 0 11.4 0 Z`} fill={i % 2 ? '#fffdf7' : '#f79ab6'} stroke={INK} strokeWidth="2"/>
                ))}
                <circle cx="36" cy="62" r="5.5" fill="#bfe3f7" stroke={INK} strokeWidth="2.5"/>
                <circle cx="64" cy="62" r="5.5" fill="#bfe3f7" stroke={INK} strokeWidth="2.5"/>
                <path d="M45 82 L45 76 Q50 71 55 76 L55 82 Z" fill="#8a6238" stroke={INK} strokeWidth="2.5" strokeLinejoin="round"/>
                <circle cx="28" cy="70" r="2.8" fill="#f7a6b9" opacity="0.6"/>
                <circle cx="72" cy="70" r="2.8" fill="#f7a6b9" opacity="0.6"/>
            </g>
        );

        const CastleArt = () => (
            <g>
                <rect x="20" y="40" width="15" height="42" rx="4" fill="#efe9fb" stroke={INK} strokeWidth="2.5"/>
                <rect x="65" y="40" width="15" height="42" rx="4" fill="#efe9fb" stroke={INK} strokeWidth="2.5"/>
                <path d="M16 42 L27.5 26 L39 42 Z" fill="#9b8bd9" stroke={INK} strokeWidth="2.5" strokeLinejoin="round"/>
                <path d="M61 42 L72.5 26 L84 42 Z" fill="#9b8bd9" stroke={INK} strokeWidth="2.5" strokeLinejoin="round"/>
                <rect x="44" y="30" width="12" height="24" rx="3" fill="#efe9fb" stroke={INK} strokeWidth="2.5"/>
                <path d="M50 30 L50 17" stroke={INK} strokeWidth="2.5" strokeLinecap="round"/>
                <path d="M50 17 L63 21 L50 26 Z" fill="#f2645a" stroke={INK} strokeWidth="2" strokeLinejoin="round"/>
                <rect x="34" y="50" width="32" height="32" rx="5" fill="#fff4e0" stroke={INK} strokeWidth="2.5"/>
                <circle cx="42" cy="61" r="4.6" fill="#bfe3f7" stroke={INK} strokeWidth="2.3"/>
                <circle cx="58" cy="61" r="4.6" fill="#bfe3f7" stroke={INK} strokeWidth="2.3"/>
                <path d="M45 82 L45 76 Q50 71 55 76 L55 82 Z" fill="#8a6238" stroke={INK} strokeWidth="2.5" strokeLinejoin="round"/>
                <circle cx="27" cy="60" r="2.6" fill="#f7a6b9" opacity="0.6"/>
                <circle cx="73" cy="60" r="2.6" fill="#f7a6b9" opacity="0.6"/>
            </g>
        );

        const SunArt = () => (
            <g>
                <g stroke="#f0a92d" strokeWidth="5" strokeLinecap="round">
                    {[0,1,2,3,4,5,6,7].map(i => {
                        const a = i * 45 * Math.PI / 180;
                        return <line key={i} x1={50 + Math.cos(a) * 27} y1={50 + Math.sin(a) * 27} x2={50 + Math.cos(a) * 35} y2={50 + Math.sin(a) * 35}/>;
                    })}
                </g>
                <circle cx="50" cy="50" r="20" fill="#ffd93d" stroke="#f0a92d" strokeWidth="3"/>
                <Face x={50} y={50} scale={0.8}/>
            </g>
        );

        const CloudArt = ({ tint = '#ffffff', line = '#cfdde8' }) => (
            <g>
                <g fill={tint} stroke={line} strokeWidth="2.5">
                    <circle cx="30" cy="60" r="13"/><circle cx="52" cy="50" r="17"/><circle cx="72" cy="60" r="12"/>
                    <rect x="22" y="56" width="58" height="16" rx="8"/>
                </g>
                <g fill={tint}>
                    <circle cx="30" cy="60" r="13"/><circle cx="52" cy="50" r="17"/><circle cx="72" cy="60" r="12"/>
                    <rect x="22" y="56" width="58" height="16" rx="8"/>
                </g>
            </g>
        );

        const RainCloudArt = () => (
            <g>
                <CloudArt tint="#c6d2dc" line="#9fb0bf"/>
                <Face x={51} y={58} scale={0.8} mood="sad"/>
                {[32, 50, 68].map((x, i) => (
                    <ellipse key={x} className="svg-drop" style={{ animationDelay: `${i * 0.35}s` }} cx={x} cy="80" rx="2.6" ry="4.2" fill="#6fb7e8"/>
                ))}
            </g>
        );

        const CookieArt = () => (
            <g>
                <path d="M50 24 C 27 24 13 43 16 62 C 33 53 43 57 50 72 C 57 57 67 53 84 62 C 87 43 73 24 50 24 Z" fill="#f2b04e" stroke={INK} strokeWidth="2.5" strokeLinejoin="round"/>
                <path d="M50 28 C 50 42 50 56 50 66" stroke="#c98a2e" strokeWidth="2" fill="none" strokeLinecap="round" opacity="0.6"/>
                <Face x={50} y={44} scale={0.95}/>
            </g>
        );

        const CookieOpenArt = () => (
            <g>
                <rect x="28" y="40" width="44" height="15" rx="4" fill="#fffdf7" stroke={INK} strokeWidth="2" transform="rotate(-6 50 47)"/>
                <path d="M35 48 h30" stroke="#f2645a" strokeWidth="2" strokeDasharray="3 3" transform="rotate(-6 50 47)"/>
                <path d="M36 64 C 18 60 10 46 14 32 C 26 38 34 46 39 58 Z" fill="#f2b04e" stroke={INK} strokeWidth="2.5" strokeLinejoin="round" transform="rotate(12 28 48)"/>
                <path d="M64 64 C 82 60 90 46 86 32 C 74 38 66 46 61 58 Z" fill="#f2b04e" stroke={INK} strokeWidth="2.5" strokeLinejoin="round" transform="rotate(-12 72 48)"/>
                <path d="M24 24 l2.5 5 5 2.5 -5 2.5 -2.5 5 -2.5 -5 -5 -2.5 5 -2.5 Z" fill="#f7b733"/>
                <path d="M74 20 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2 Z" fill="#f79ab6"/>
            </g>
        );

        const Sprite = ({ art: Art, size = 64, className = '', style }) => (
            <svg viewBox="0 0 100 100" width={size} height={size} className={className} style={style} aria-hidden="true"><Art/></svg>
        );

        const VillageScene = () => (
            <svg viewBox="0 0 440 215" className="w-full max-w-2xl mx-auto block" aria-hidden="true">
                <g transform="translate(325,-4) scale(0.75)"><SunArt/></g>
                <g transform="translate(20,6) scale(0.62)" className="cloud-drift"><CloudArt/></g>
                <g transform="translate(140,-6) scale(0.5)" className="cloud-drift" style={{animationDelay:'2s'}}><CloudArt/></g>
                <path d="M0 152 Q110 102 220 142 T440 134 L440 215 L0 215 Z" fill="#b3dd8b"/>
                <path d="M0 182 Q150 152 300 177 T440 170 L440 215 L0 215 Z" fill="#8fce74"/>
                <path d="M55 205 Q160 172 235 188 T410 176" stroke="#fffdf7" strokeWidth="5" strokeDasharray="0.5 12" strokeLinecap="round" fill="none" opacity="0.9"/>
                <g transform="translate(18,98) scale(0.72)"><TreeArt/></g>
                <g transform="translate(110,82) scale(0.88)"><HouseArt/></g>
                <g transform="translate(228,88) scale(0.8)"><ShopArt/></g>
                <g transform="translate(330,74) scale(0.95)"><CastleArt/></g>
                <g transform="translate(195,148) scale(0.45)"><SproutArt/></g>
            </svg>
        );

        const Bunting = () => (
            <svg viewBox="0 0 400 26" preserveAspectRatio="none" className="w-full h-6 absolute top-0 left-0" aria-hidden="true">
                <path d="M0 3 Q200 13 400 3" stroke={INK} strokeWidth="1.6" fill="none"/>
                {[...Array(9)].map((_, i) => {
                    const x = 20 + i * 44;
                    const y = 3 + Math.sin((i + 0.5) / 9 * Math.PI) * 9;
                    const colors = ['#f2645a', '#f7b733', '#7cc576', '#6fb7e8', '#f79ab6'];
                    return <path key={i} d={`M${x} ${y} L${x + 14} ${y} L${x + 7} ${y + 13} Z`} fill={colors[i % 5]} stroke={INK} strokeWidth="1.2"/>;
                })}
            </svg>
        );

        // ================= 게임 상수 데이터 =================
        const FORTUNES = [
            { text: "주식을 사는 것이 아니라, 기업의 일부를 사는 것이다.", author: "워런 버핏" },
            { text: "10년 보유할 주식이 아니라면 10분도 보유하지 마라.", author: "워런 버핏" },
            { text: "가격은 당신이 지불하는 것이고, 가치는 당신이 얻는 것이다.", author: "워런 버핏" },
            { text: "시장이 두려움에 떨 때 욕심을 내고, 욕심을 부릴 때 두려워하라.", author: "워런 버핏" },
            { text: "투자의 제1원칙은 돈을 잃지 않는 것. 제2원칙은 제1원칙을 잊지 않는 것.", author: "워런 버핏" },
            { text: "안전마진(Margin of Safety)이야말로 성공 투자의 핵심이다.", author: "벤저민 그레이엄" },
            { text: "시장은 단기적으로 인기투표기계, 장기적으로는 저울이다.", author: "벤저민 그레이엄" },
            { text: "현명한 투자자는 비관주의자에게 사서 낙관주의자에게 판다.", author: "벤저민 그레이엄" },
            { text: "자신이 무엇을 소유하고 있는지, 왜 소유하고 있는지 알아야 한다.", author: "피터 린치" },
            { text: "당신이 아는 것에 투자하라. 일상 속에 10루타 종목이 숨어 있다.", author: "피터 린치" },
            { text: "주식시장에서 중요한 장기는 머리가 아니라 배짱이다.", author: "피터 린치" },
            { text: "큰 돈은 사고파는 데 있지 않고, 기다리는 데 있다.", author: "찰리 멍거" },
            { text: "훌륭한 기업을 적당한 가격에 사는 것이, 적당한 기업을 훌륭한 가격에 사는 것보다 낫다.", author: "찰리 멍거" },
            { text: "뒤집어서 생각하라. 항상 뒤집어서 생각하라.", author: "찰리 멍거" },
            { text: "복리는 세계 8대 불가사의다. 아는 자는 벌고, 모르는 자는 낸다.", author: "알베르트 아인슈타인" },
            { text: "가격이 움직인 이유를 설명하지 못하면, 아직 그 자산을 아는 것이 아니다.", author: "포춘빌리지 촌장" },
            { text: "뉴스에 놀라기 전에 원인을 분석하라. 브릿지 문제인지, 프로젝트 문제인지.", author: "포춘빌리지 촌장" },
            { text: "비 오는 날에도 씨앗은 자란다. 하락장은 공부의 계절이다.", author: "포춘빌리지 촌장" },
            { text: "기록하지 않은 매매는 배움이 없는 매매다.", author: "포춘빌리지 촌장" },
            { text: "이웃의 수익률이 아니라 이웃의 '생각'을 배워라.", author: "포춘빌리지 촌장" },
            { text: "시간은 훌륭한 기업의 친구이고, 평범한 기업의 적이다.", author: "워런 버핏" },
            { text: "위험은 자신이 무엇을 하는지 모르는 데서 온다.", author: "워런 버핏" },
            { text: "떨어지는 칼날을 잡지 말고, 땅에 꽂힌 뒤 원인을 분석하고 주워라.", author: "월가 격언" },
            { text: "계란을 한 바구니에 담지 마라. 마을에도 여러 건물이 필요하다.", author: "월가 격언" },
        ];

        const LEVELS = [
            { lv: 1, title: "새싹 개미", icon: "🐜", minXp: 0 },
            { lv: 2, title: "성실한 꿀벌", icon: "🐝", minXp: 200 },
            { lv: 3, title: "알뜰 다람쥐", icon: "🐿️", minXp: 500 },
            { lv: 4, title: "지혜로운 부엉이", icon: "🦉", minXp: 1000 },
            { lv: 5, title: "가치투자 여우", icon: "🦊", minXp: 2000 },
            { lv: 6, title: "마을 촌장 곰", icon: "🐻", minXp: 3500 },
            { lv: 7, title: "투자 현인 거북", icon: "🐢", minXp: 5500 },
        ];

        // 증권사/거래소에서 복사한 텍스트를 관대하게 파싱
        function parsePastedTrades(text) {
            const rows = [];
            text.split(/\r?\n/).forEach(raw => {
                const line = raw.trim();
                if (!line) return;
                const side = /매도|SELL/i.test(line) ? 'SELL' : (/매수|BUY/i.test(line) ? 'BUY' : null);
                if (!side) return;
                const dm = line.match(/(20\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
                const date = dm ? `${dm[1]}-${String(dm[2]).padStart(2, '0')}-${String(dm[3]).padStart(2, '0')}` : todayStr();
                const cleaned = (dm ? line.replace(dm[0], ' ') : line).replace(/매수|매도|BUY|SELL/gi, ' ');
                const name = (cleaned.match(/[가-힣A-Za-z][가-힣A-Za-z0-9.]{0,19}/g) || [])
                    .map(s => s.trim())
                    .filter(s => s && !/^(체결|주문|현금|신용|보통|완료|정정|취소|KRW|USDT|원|주|개)$/i.test(s))[0] || '';
                const nums = (cleaned.match(/\d[\d,]*(?:\.\d+)?/g) || []).map(s => Number(s.replace(/,/g, ''))).filter(n => n > 0);
                const price = nums.length ? Math.max(...nums) : 0;
                const qty = nums.length > 1 ? Math.min(...nums) : 0;
                if (name) rows.push({ date, name, side, qty, price });
            });
            return rows.slice(0, 100);
        }

                                pnlRate: avg > 0 ? ((cur - avg) / avg) * 100 : 0,

                            else next.push(h);
                        });
                        return next;

                        <div className="fixed inset-0 bg-[#5b4432]/60 backdrop-blur-sm z-[90] flex justify-center items-center p-4">
                            <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border-2 border-violet-200 max-h-[90vh] overflow-y-auto pop-in">
                                <button onClick={() => setNoteFormOpen(false)} className="absolute top-4 right-4 text-stone-400 hover:text-stone-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <div>
                                    <h3 className="text-lg font-black text-[#5b4432]">🕵️ 사건 원인 분석노트</h3>
                                    <p className="text-[11px] text-stone-400 font-body">"왜 올랐지? 왜 떨어졌지?"를 스스로 진단하는 최고의 공부 (+50 XP)</p>
                                </div>
                                <form onSubmit={handleNoteSubmit} className="space-y-3 text-xs">
                                    <div>
                                        <label className="text-stone-500 block mb-1 font-bold">자산 / 프로젝트</label>
                                        <input type="text" value={noteAsset} onChange={(e) => setNoteAsset(e.target.value)} placeholder="예: 샌드박스(SAND), 삼성전자" required className={inputCls}/>
                                    </div>
                                    <div>
                                        <label className="text-stone-500 block mb-1 font-bold">사건 유형</label>
                                        <div className="grid grid-cols-3 gap-1.5">
                                            {EVENT_TYPES.map(t => (
                                                <button type="button" key={t.id} onClick={() => setNoteEvent(t.id)}
                                                        className={`p-2 rounded-xl font-bold border-2 transition ${noteEvent === t.id ? 'bg-orange-100 border-orange-400 text-orange-900' : 'bg-[#fdf6e9] border-[#ecd9b8] text-stone-500'}`}>
                                                    {t.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-stone-500 block mb-1 font-bold">나의 원인 진단 <span className="font-normal text-stone-400">(개발? 거버넌스? 브릿지?)</span></label>
                                        <div className="grid grid-cols-3 gap-1.5">
                                            {CAUSE_TYPES.map(t => (
                                                <button type="button" key={t.id} onClick={() => setNoteCause(t.id)}
                                                        className={`p-2 rounded-xl font-bold border-2 transition ${noteCause === t.id ? 'bg-violet-100 border-violet-400 text-violet-900' : 'bg-[#fdf6e9] border-[#ecd9b8] text-stone-500'}`}>
                                                    {t.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-stone-500 block mb-1 font-bold">무슨 일이 있었나요?</label>
                                        <textarea value={noteWhat} onChange={(e) => setNoteWhat(e.target.value)} rows="2" required
                                                  placeholder="예: 해킹 이슈로 코인 무단발행 발생, 체인 동결됨" className={inputCls + " font-body resize-none"}></textarea>
                                    </div>
                                    <div>
                                        <label className="text-stone-500 block mb-1 font-bold">나의 원인 분석</label>
                                        <textarea value={noteAnalysis} onChange={(e) => setNoteAnalysis(e.target.value)} rows="3"
                                                  placeholder="예: 코인베이스·바이낸스 체인 브릿지 문제. 이더리움·폴리곤 체인은 멀쩡 → 프로젝트 자체보다 거래소 브릿지 리스크" className={inputCls + " font-body resize-none"}></textarea>
                                    </div>
                                    <div>
                                        <label className="text-stone-500 block mb-1 font-bold">결론 & 나의 대응</label>
                                        <textarea value={noteConclusion} onChange={(e) => setNoteConclusion(e.target.value)} rows="2"
                                                  placeholder="예: 펀더멘털 훼손 아님. 브릿지 복구 공지까지 관망, 패닉셀 안 함" className={inputCls + " font-body resize-none"}></textarea>
                                    </div>
                                    <button type="submit" className="btn3d w-full bg-violet-300 hover:bg-violet-200 text-violet-950 font-black py-3.5 rounded-2xl text-xs">
                                        🔬 분석노트 저장하기 (+50 XP)
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 거래내역 가져오기 (붙여넣기 / 업비트) */}
                    {importModalOpen && (
                        <div className="fixed inset-0 bg-[#5b4432]/60 backdrop-blur-sm z-[90] flex justify-center items-center p-4">
                            <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border-2 border-[#ecd9b8] max-h-[90vh] overflow-y-auto pop-in">
                                <button onClick={() => setImportModalOpen(false)} className="absolute top-4 right-4 text-stone-400 hover:text-stone-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="text-lg font-black text-[#5b4432]">📥 실거래 데이터 가져오기</h3>
                                <div className="flex bg-[#fdf6e9] rounded-2xl p-1 text-xs font-bold border-2 border-[#ecd9b8]">
                                    <button onClick={() => setImportMode('paste')} className={`flex-1 py-2 rounded-xl transition ${importMode === 'paste' ? 'bg-white shadow text-[#5b4432]' : 'text-stone-400'}`}>
                                        📋 증권사 붙여넣기
                                    </button>
                                    <button onClick={() => setImportMode('upbit')} className={`flex-1 py-2 rounded-xl transition ${importMode === 'upbit' ? 'bg-white shadow text-[#5b4432]' : 'text-stone-400'}`}>
                                        🪙 업비트 API
                                    </button>
                                </div>

                                {importMode === 'paste' ? (
                                    <div className="space-y-3 text-xs">
                                        <p className="text-stone-500 font-body">
                                            HTS/MTS 체결내역 화면에서 복사해 붙여넣으세요. 한 줄에 한 건씩,
                                            <b> 날짜 · 종목명 · 매수/매도 · 수량 · 단가</b>가 있으면 알아서 인식해요.
                                        </p>
                                        <textarea value={importText} onChange={(e) => setImportText(e.target.value)} rows="5"
                                                  placeholder={"2026-08-20 삼성전자 매수 10 72,000\n2026-08-22 SAND 매도 300 450"}
                                                  className={inputCls + " font-mono resize-none"}></textarea>
                                        {importPreview.length > 0 && (
                                            <div className="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-3 space-y-1 max-h-36 overflow-y-auto">
                                                <span className="font-black text-emerald-800 block">✅ {importPreview.length}건 인식됨</span>
                                                {importPreview.map((r, i) => (
                                                    <div key={i} className="flex justify-between text-[11px] text-stone-600">
                                                        <span>{r.date} · <b>{r.name}</b> {r.side === 'BUY' ? '매수' : '매도'}</span>
                                                        <span>{r.qty || '-'} × {r.price ? r.price.toLocaleString() : '-'}원</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                        <button onClick={handlePasteImport} disabled={!importPreview.length}
                                                className="btn3d w-full bg-emerald-300 hover:bg-emerald-200 text-[#1e3b16] font-black py-3 rounded-2xl disabled:opacity-40">
                                            매매일지로 가져오기 (+30 XP)
                                        </button>
                                    </div>
                                ) : (
                                    <div className="space-y-3 text-xs">
                                        <p className="text-stone-500 font-body">
                                            업비트 <b>마이페이지 → Open API 관리</b>에서 <b>'자산조회 · 주문조회' 권한만</b> 체크해 키를 발급하세요.
                                            (주문/출금 권한은 절대 켜지 마세요!) 키는 <b>내 브라우저에만</b> 저장돼요.
                                        </p>
                                        <div>
                                            <label className="text-stone-500 block mb-1 font-bold">Access Key</label>
                                            <input type="text" value={upbitKeys.accessKey} onChange={(e) => setUpbitKeys(k => ({ ...k, accessKey: e.target.value }))} className={inputCls + " font-mono"}/>
                                        </div>
                                        <div>
                                            <label className="text-stone-500 block mb-1 font-bold">Secret Key</label>
                                            <input type="password" value={upbitKeys.secretKey} onChange={(e) => setUpbitKeys(k => ({ ...k, secretKey: e.target.value }))} className={inputCls + " font-mono"}/>
                                        </div>
                                        {upbitMsg && (
                                            <div className={`p-3 rounded-2xl border-2 font-body ${upbitMsg.ok ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-700'}`}>
                                                {upbitMsg.text}
                                            </div>
                                        )}
                                        <div className="grid grid-cols-2 gap-2">
                                            <button onClick={handleUpbitBalances} disabled={upbitBusy}
                                                    className="btn3d bg-sky-200 hover:bg-sky-100 text-sky-900 font-black py-3 rounded-2xl disabled:opacity-40">
                                                {upbitBusy ? '⏳' : '💰'} 코인 잔고 가져오기
                                            </button>
                                            <button onClick={handleUpbitOrders} disabled={upbitBusy}
                                                    className="btn3d bg-amber-200 hover:bg-amber-100 text-amber-900 font-black py-3 rounded-2xl disabled:opacity-40">
                                                {upbitBusy ? '⏳' : '📜'} 체결내역 가져오기
                                            </button>
                                        </div>
                                        <p className="text-[10px] text-stone-400 font-body">
                                            ⚠️ 이 기능은 CORS 때문에 Vercel 배포 주소(프록시 서버 포함)에서만 동작해요. 키 발급 시 등록한 IP에서만 조회가 허용돼요.
                                        </p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 팀 생성 / 조인 / 초대 */}
                    {createTeamModalOpen && (
                        <div className="fixed inset-0 bg-[#5b4432]/60 backdrop-blur-sm z-[90] flex justify-center items-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border-2 border-[#ecd9b8] pop-in">
                                <button onClick={() => setCreateTeamModalOpen(false)} className="absolute top-4 right-4 text-stone-400 hover:text-stone-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="text-lg font-black text-[#5b4432]">👑 마을 연합 만들기</h3>
                                <form onSubmit={handleCreateTeamSubmit} className="space-y-3 text-xs">
                                    <div>
                                        <label className="text-stone-500 block mb-1 font-bold">연합(팀) 이름</label>
                                        <input type="text" value={newTeamNameInput} onChange={(e) => setNewTeamNameInput(e.target.value)} placeholder="예: 가치투자 1번지" required className={inputCls}/>
                                    </div>
                                    <button type="submit" className="btn3d w-full bg-[#5b4432] text-amber-50 font-black py-3.5 rounded-2xl text-xs" style={{borderColor:'#3a2c1f', boxShadow:'0 4px 0 #3a2c1f'}}>
                                        연합 결성하기 (+40 XP)
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {joinTeamModalOpen && (
                        <div className="fixed inset-0 bg-[#5b4432]/60 backdrop-blur-sm z-[90] flex justify-center items-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border-2 border-[#ecd9b8] pop-in">
                                <button onClick={() => setJoinTeamModalOpen(false)} className="absolute top-4 right-4 text-stone-400 hover:text-stone-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="text-lg font-black text-[#5b4432]">🔑 초대코드로 연합 가입</h3>
                                <form onSubmit={handleJoinTeamSubmit} className="space-y-3 text-xs">
                                    <div>
                                        <label className="text-stone-500 block mb-1 font-bold">초대 코드</label>
                                        <input type="text" value={joinCodeInput} onChange={(e) => setJoinCodeInput(e.target.value)} placeholder="예: TEAM777" required className={inputCls + " uppercase"}/>
                                    </div>
                                    <button type="submit" className="btn3d w-full bg-emerald-300 hover:bg-emerald-200 text-[#1e3b16] font-black py-3.5 rounded-2xl text-xs">
                                        연합 가입하기 (+40 XP)
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {inviteModalOpen && team && (
                        <div className="fixed inset-0 bg-[#5b4432]/60 backdrop-blur-sm z-[90] flex justify-center items-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-center relative border-2 border-[#ecd9b8] pop-in">
                                <button onClick={() => setInviteModalOpen(false)} className="absolute top-4 right-4 text-stone-400 hover:text-stone-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <span className="text-3xl inline-block floaty">💌</span>
                                <div className="text-lg font-black text-[#5b4432]">이웃 초대장</div>
                                <div className="p-4 bg-amber-50 rounded-2xl border-2 border-dashed border-amber-300 text-2xl font-black text-[#5b4432] tracking-widest">
                                    {team.code}
                                </div>
                                <button onClick={handleCopyLink} className="btn3d w-full bg-emerald-300 hover:bg-emerald-200 text-[#1e3b16] font-black py-3.5 rounded-2xl text-xs">
                                    {copiedNotice ? '✅ 초대 링크 복사 완료!' : '📋 초대 링크 복사하기'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 토스트 */}
                    <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[110] space-y-2 w-full max-w-xs px-3 pointer-events-none">
                        {toasts.map(t => (
                            <div key={t.id} className="toast-up bg-[#5b4432] text-amber-50 px-4 py-3 rounded-2xl shadow-xl text-xs font-bold flex items-center gap-2 border-2 border-[#3a2c1f]">
                                <span className="text-base">{t.icon}</span>
                                <span>{t.msg}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
