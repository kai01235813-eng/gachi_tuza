<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>포춘시티 (Fortune City) - 투자 도시 시뮬레이션</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for React JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; background-color: #ecfdf5; color: #0f172a; overflow-x: hidden; }
        .font-jua { font-family: 'Jua', sans-serif; }
        
        /* Fortune City Lush Green Map Styling */
        .town-map {
            background: radial-gradient(circle, #dcfce7 0%, #bbf7d0 60%, #86efac 100%);
            border: 4px solid #4ade80;
            box-shadow: inset 0 0 40px rgba(22, 101, 52, 0.15);
        }

        .tile-grass {
            background: rgba(255, 255, 255, 0.4);
            border: 2px dashed rgba(74, 222, 128, 0.6);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tile-grass:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: #16a34a;
            transform: scale(1.03) translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(22, 101, 52, 0.2);
        }

        .building-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .fab-glow {
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4), 0 0 0 4px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="min-h-screen pb-28 selection:bg-emerald-800 selection:text-white">

    <!-- React App Root Container -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Authentic Fortune City Simulation Platform ---
        function App() {
            // Mayor & City Stats
            const [mayor, setMayor] = useState({
                name: '스마트개미 시장님',
                avatar: '🎩',
                cityLevel: 5,
                population: 1420,
                gold: 485000,
                gems: 120,
                streak: 5
            });

            // Fortune City Map Grid Tiles (4x3 Isometric Grid)
            const [cityTiles, setCityTiles] = useState([
                { id: 1, name: '🏰 가치 중앙 시청', symbol: '시청', level: 5, type: '시청', pnl: 18.5, icon: '🏰', color: 'from-amber-100 to-amber-200 border-amber-300' },
                { id: 2, name: '🏢 삼성 주식 타워', symbol: '$삼성전자', level: 3, type: '주식', pnl: 8.5, icon: '🏢', color: 'from-sky-100 to-sky-200 border-sky-300' },
                { id: 3, name: '🪙 비트코인 뱅크', symbol: '$BTC', level: 2, type: '코인', pnl: 12.4, icon: '🪙', color: 'from-yellow-100 to-yellow-200 border-yellow-300' },
                { id: 4, name: '⚡ 엔비디아 테크 랩', symbol: '$NVDA', level: 2, type: '주식', pnl: 15.2, icon: '⚡', color: 'from-emerald-100 to-emerald-200 border-emerald-300' },
                { id: 5, name: '🌳 녹색 수익 정원', symbol: '$테슬라', level: 1, type: '정원', pnl: 4.8, icon: '🌳', color: 'from-green-100 to-green-200 border-green-300' },
                { id: 6, name: '🏦 달러 세이빙 파이낸스', symbol: '$USD', level: 1, type: '은행', pnl: 2.1, icon: '🏦', color: 'from-indigo-100 to-indigo-200 border-indigo-300' }
            ]);

            // Feed & Citizens Log
            const [citizensFeed, setCitizensFeed] = useState([
                { id: 101, author: '스마트개미', avatar: '🎩', action: '🏢 삼성 주식 타워 Lv.3 건설', pnl: '+8.5%', emotion: '😊 신남', time: '10분 전' },
                { id: 102, author: '박비트', avatar: '🐱', action: '🪙 비트코인 뱅크 Lv.2 건설', pnl: '+12.4%', emotion: '🚀 럭셔리', time: '25분 전' },
                { id: 103, author: '최솔라', avatar: '🦊', action: '⚡ 솔라나 센터 Lv.1 건설', pnl: '-4.2%', emotion: '😭 HP 85%', time: '1시간 전' }
            ]);

            const [activeTab, setActiveTab] = useState('map'); // 'map', 'citizens', 'ranking'
            const [inputModalOpen, setInputModalOpen] = useState(false);
            const [selectedTile, setSelectedTile] = useState(null);
            const [profileModalOpen, setProfileModalOpen] = useState(false);

            // Natural Language Construction Input
            const [promptText, setPromptText] = useState('');
            const [selectedAsset, setSelectedAsset] = useState('📈 주식');

            // Handle Constructing New Building on Fortune City Map
            const handleConstructBuilding = (e) => {
                e.preventDefault();
                if (!promptText.trim()) return;

                const text = promptText.trim();
                const detectedSymbol = text.includes('삼성') ? '$삼성전자' : text.includes('비트') ? '$BTC' : text.includes('솔라') ? '$SOL' : '$NVDA';
                const buildingName = detectedSymbol === '$삼성전자' ? '🏢 삼성 주식 타워' : detectedSymbol === '$BTC' ? '🪙 비트코인 뱅크' : '⚡ 엔비디아 테크 랩';
                
                const newTile = {
                    id: Date.now(),
                    name: `${buildingName} Lv.1`,
                    symbol: detectedSymbol,
                    level: 1,
                    type: selectedAsset === '📈 주식' ? '주식' : '코인',
                    pnl: 6.8,
                    icon: selectedAsset === '📈 주식' ? '🏢' : '🪙',
                    color: selectedAsset === '📈 주식' ? 'from-sky-100 to-sky-200 border-sky-300' : 'from-amber-100 to-amber-200 border-amber-300'
                };

                setCityTiles(prev => [newTile, ...prev]);
                setMayor(prev => ({
                    ...prev,
                    population: prev.population + 150,
                    gold: prev.gold + 50000,
                    streak: prev.streak + 1
                }));

                setCitizensFeed(prev => [
                    { id: Date.now(), author: mayor.name, avatar: mayor.avatar, action: `${buildingName} Lv.1 건설`, pnl: '+6.8%', emotion: '😊 신남', time: '방금 전' },
                    ...prev
                ]);

                setPromptText('');
                setInputModalOpen(false);
            };

            return (
                <div className="min-h-screen">
                    {/* Top Fortune City Dashboard Bar */}
                    <header className="bg-slate-900 text-white px-4 md:px-8 py-3 sticky top-0 z-50 shadow-lg border-b border-slate-800 flex justify-between items-center font-jua">
                        <div className="flex items-center space-x-2.5">
                            <div className="bg-emerald-500 p-2 rounded-2xl shadow-md">
                                <i className="fa-solid fa-tree text-white text-base"></i>
                            </div>
                            <div>
                                <span className="font-black text-xl text-white tracking-tight">포춘시티 <span className="text-emerald-400 text-sm">Fortune City</span></span>
                            </div>
                        </div>

                        {/* City Stats Meters */}
                        <div className="flex items-center gap-3 text-xs">
                            <div className="flex items-center gap-1 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-amber-400">
                                <span>🪙</span>
                                <span className="font-mono font-bold">{mayor.gold.toLocaleString()}원</span>
                            </div>
                            <div className="hidden sm:flex items-center gap-1 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-emerald-400">
                                <span>👥</span>
                                <span className="font-mono font-bold">{mayor.population.toLocaleString()}명</span>
                            </div>
                            <div className="flex items-center gap-1 bg-amber-500/10 text-amber-400 px-3 py-1.5 rounded-xl border border-amber-500/30">
                                <span>🔥 {mayor.streak}일</span>
                            </div>
                            <button onClick={() => setProfileModalOpen(true)} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded-xl shadow-md transition flex items-center gap-1">
                                <span className="text-sm">{mayor.avatar}</span>
                                <span className="hidden md:inline">{mayor.name}</span>
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="max-w-3xl mx-auto px-4 pt-5 space-y-5">

                        {/* Top View Selector Tabs */}
                        <div className="flex justify-center font-jua text-sm">
                            <div className="bg-white p-1.5 rounded-2xl shadow-sm border border-emerald-200 flex gap-2">
                                <button onClick={() => setActiveTab('map')} className={activeTab === 'map' ? 'bg-emerald-600 text-white px-5 py-2 rounded-xl font-bold transition shadow-sm' : 'text-slate-600 hover:bg-slate-100 px-5 py-2 rounded-xl font-bold transition'}>
                                    🏙️ 나만의 투자 도시 지도 ({cityTiles.length})
                                </button>
                                <button onClick={() => setActiveTab('citizens')} className={activeTab === 'citizens' ? 'text-emerald-900 bg-emerald-100 border border-emerald-300 px-5 py-2 rounded-xl font-bold transition' : 'text-slate-600 hover:bg-slate-100 px-5 py-2 rounded-xl font-bold transition'}>
                                    📖 시민 피드
                                </button>
                            </div>
                        </div>

                        {/* TAB 1: Authentic Fortune City Isometric Town Map */}
                        {activeTab === 'map' && (
                            <div className="town-map p-6 rounded-3xl shadow-xl space-y-4">
                                <div className="flex justify-between items-center font-jua">
                                    <div className="flex items-center gap-2">
                                        <span className="bg-emerald-950 text-emerald-300 text-xs px-3.5 py-1 rounded-full font-bold">🌳 {mayor.name}의 가치 포춘시티</span>
                                        <span className="text-xs text-emerald-900 font-bold">시티 레벨: Lv.{mayor.cityLevel}</span>
                                    </div>
                                    <span className="text-xs text-emerald-800 font-bold">건물 갯수: {cityTiles.length}개</span>
                                </div>

                                {/* Isometric Town Grid Tiles */}
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 pt-2">
                                    {cityTiles.map(tile => (
                                        <div
                                            key={tile.id}
                                            onClick={() => setSelectedTile(tile)}
                                            className={`tile-grass bg-gradient-to-br ${tile.color} p-4 rounded-3xl cursor-pointer building-pop space-y-2 relative overflow-hidden`}
                                        >
                                            <div className="flex justify-between items-start font-jua">
                                                <span className="text-3xl filter drop-shadow-md">{tile.icon}</span>
                                                <span className="bg-slate-900/90 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">Lv.{tile.level}</span>
                                            </div>
                                            <div className="font-jua">
                                                <h3 className="font-bold text-slate-900 text-sm">{tile.name}</h3>
                                                <span className="text-slate-600 text-[11px] font-bold">{tile.symbol}</span>
                                            </div>
                                            <div className="flex justify-between items-center pt-1 border-t border-slate-900/10 font-jua text-xs">
                                                <span className="text-slate-500 text-[10px]">수익률</span>
                                                <span className={tile.pnl >= 0 ? 'text-emerald-700 font-black font-mono' : 'text-rose-600 font-black font-mono'}>
                                                    {tile.pnl >= 0 ? `+${tile.pnl}%` : `${tile.pnl}%`}
                                                </span>
                                            </div>
                                        </div>
                                    ))}

                                    {/* Empty Grass Tile for Construction */}
                                    <div
                                        onClick={() => setInputModalOpen(true)}
                                        className="tile-grass border-2 border-dashed border-emerald-400 p-4 rounded-3xl cursor-pointer flex flex-col justify-center items-center text-center space-y-1 py-8 hover:border-emerald-600 transition"
                                    >
                                        <div className="w-10 h-10 rounded-full bg-emerald-500 text-white flex justify-center items-center text-lg font-bold shadow-md">
                                            <i className="fa-solid fa-plus"></i>
                                        </div>
                                        <span className="font-jua text-xs font-bold text-emerald-900">새 건물 건축</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: Citizens Feed */}
                        {activeTab === 'citizens' && (
                            <div className="bg-white p-5 rounded-3xl border border-slate-200 space-y-3 font-jua text-xs">
                                <h3 className="font-bold text-slate-900 text-sm border-b border-slate-100 pb-2">📖 도시 시민 실시간 활동 피드</h3>
                                {citizensFeed.map(item => (
                                    <div key={item.id} className="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 flex justify-between items-center">
                                        <div className="flex items-center gap-3">
                                            <span className="text-xl">{item.avatar}</span>
                                            <div>
                                                <span className="font-bold text-slate-900 text-sm">{item.author}</span>
                                                <span className="text-emerald-900 font-bold block">{item.action}</span>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-emerald-600 font-black font-mono text-sm block">{item.pnl}</span>
                                            <span className="text-slate-400 text-[10px]">{item.time}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Floating Bottom Action Bar (Fortune City FAB) */}
                    <div className="fixed bottom-5 left-0 right-0 z-40 flex justify-center items-center px-4 font-jua">
                        <div className="bg-slate-900/95 backdrop-blur-md text-white px-6 py-3 rounded-full shadow-2xl border border-slate-800 flex items-center gap-6">
                            <button onClick={() => setActiveTab('map')} className={activeTab === 'map' ? 'text-emerald-400 font-bold flex flex-col items-center text-xs' : 'text-slate-400 hover:text-white flex flex-col items-center text-xs'}>
                                <i className="fa-solid fa-city text-base"></i>
                                <span className="mt-0.5">내 도시</span>
                            </button>

                            {/* Center Floating Construction Button */}
                            <button
                                onClick={() => setInputModalOpen(true)}
                                className="bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-900 font-black px-6 py-3 rounded-2xl text-sm flex items-center gap-2 fab-glow hover:scale-105 active:scale-95 transition"
                            >
                                <i className="fa-solid fa-hammer text-base"></i>
                                <span>건물 건축하기</span>
                            </button>

                            <button onClick={() => setActiveTab('citizens')} className={activeTab === 'citizens' ? 'text-emerald-400 font-bold flex flex-col items-center text-xs' : 'text-slate-400 hover:text-white flex flex-col items-center text-xs'}>
                                <i className="fa-solid fa-users text-base"></i>
                                <span className="mt-0.5">시민 피드</span>
                            </button>
                        </div>
                    </div>

                    {/* Fortune City Construction Modal (Zero UI Natural Language Input) */}
                    {inputModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border border-slate-200">
                                <button onClick={() => setInputModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <div className="space-y-1">
                                    <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                                        <span>🔨 새로운 투자 건물 건축</span>
                                    </h3>
                                    <p className="text-xs text-slate-500">자연어로 매매를 기록하면 도시 타일 위에 주식 타워 또는 코인 뱅크가 즉시 생성됩니다.</p>
                                </div>

                                <div className="flex gap-2 text-xs pt-1">
                                    <button type="button" onClick={() => setSelectedAsset('📈 주식')} className={selectedAsset === '📈 주식' ? 'bg-slate-900 text-white px-3 py-1.5 rounded-xl font-bold' : 'bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl font-bold'}>
                                        📈 주식 타워
                                    </button>
                                    <button type="button" onClick={() => setSelectedAsset('🪙 코인')} className={selectedAsset === '🪙 코인' ? 'bg-slate-900 text-white px-3 py-1.5 rounded-xl font-bold' : 'bg-slate-100 text-slate-700 px-3 py-1.5 rounded-xl font-bold'}>
                                        🪙 코인 뱅크
                                    </button>
                                </div>

                                <form onSubmit={handleConstructBuilding} className="space-y-3">
                                    <input
                                        type="text"
                                        value={promptText}
                                        onChange={(e) => setPromptText(e.target.value)}
                                        placeholder="예: '$삼성전자 100만원 매수' 또는 '$BTC 50만원 매수'..."
                                        required
                                        className="w-full bg-slate-50 text-slate-900 placeholder-slate-400 text-sm px-4 py-3.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500 border border-slate-200"
                                    />

                                    <div className="flex gap-2 text-xs">
                                        <button type="button" onClick={() => setPromptText('$삼성전자 100만원 매수했어')} className="bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1.5 rounded-xl text-[11px]">
                                            📈 "$삼성전자 100만원 매수"
                                        </button>
                                        <button type="button" onClick={() => setPromptText('$BTC 50만원 매수했어')} className="bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1.5 rounded-xl text-[11px]">
                                            🪙 "$BTC 50만원 매수"
                                        </button>
                                    </div>

                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl shadow-md text-xs transition">
                                        도시 타일에 건축 완료하기
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Building Info Modal */}
                    {selectedTile && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-center relative border border-slate-200">
                                <button onClick={() => setSelectedTile(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <div className="text-4xl py-2">{selectedTile.icon}</div>
                                <div>
                                    <h3 className="text-lg font-black text-slate-900">{selectedTile.name}</h3>
                                    <span className="text-xs text-slate-500 font-bold">{selectedTile.symbol} · 레벨 Lv.{selectedTile.level}</span>
                                </div>
                                <div className="p-3 bg-emerald-50 text-emerald-900 rounded-2xl text-xs font-bold border border-emerald-200">
                                    투자 수익률: <span className="font-mono text-sm font-black">{selectedTile.pnl >= 0 ? `+${selectedTile.pnl}%` : `${selectedTile.pnl}%`}</span>
                                </div>
                                <button onClick={() => setSelectedTile(null)} className="w-full bg-slate-900 text-white font-bold py-3 rounded-2xl text-xs">
                                    확인
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Profile Modal */}
                    {profileModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border border-slate-200">
                                <button onClick={() => setProfileModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="text-lg font-black text-slate-900">👤 시장님 프로필 설정</h3>
                                <form onSubmit={(e) => { e.preventDefault(); setProfileModalOpen(false); }} className="space-y-3 text-xs">
                                    <div>
                                        <label className="text-slate-600 block mb-1">시장 닉네임</label>
                                        <input type="text" value={mayor.name} onChange={(e) => setMayor(prev => ({ ...prev, name: e.target.value }))} required className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl" />
                                    </div>
                                    <button type="submit" className="w-full bg-slate-900 text-white font-bold py-3 rounded-2xl text-xs">
                                        저장하기
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
