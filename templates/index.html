<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>같이투자 (Gachi Tuza) - 팀 소셜 트레이딩 게임 플랫폼</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for React JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; background-color: #f8fafc; color: #0f172a; }
        .font-jua { font-family: 'Jua', sans-serif; }
        .white-card { background: #ffffff; border: 1.5px solid #e2e8f0; box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05); }
        .prompt-shadow { box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.15); }
        .ticker-badge { background: #e0e7ff; color: #3730a3; font-weight: 700; padding: 2px 8px; border-radius: 8px; }
        .hero-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%); }
    </style>
</head>
<body class="bg-gradient-to-br from-[#f8fafc] via-[#f1f5f9] to-[#e2e8f0] min-h-screen selection:bg-indigo-900 selection:text-white">

    <!-- React App Root Container -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Complete Team Social Trading Platform Application ---
        function App() {
            // User Auth State
            const [user, setUser] = useState({
                isLoggedIn: false,
                provider: '',
                nickname: '',
                avatar: '🎩',
                archetype: '💎 기업 실질가치 장기투자자',
                totalCapitalKrw: 15000000,
                totalProfitKrw: 2775000,
                returnPct: 18.5,
                xp: 2450,
                streak: 5
            });

            // Social Trading Team / Squad State
            const [team, setTeam] = useState({
                id: 1,
                name: '같이투자 1기 챔피언 팀',
                code: 'GACHI7',
                leader: '스마트개미',
                membersCount: 8,
                totalReturnPct: 14.8,
                targetCapitalKrw: 50000000,
                currentCapitalKrw: 37000000
            });

            // Team Members Roster
            const [teamMembers, setTeamMembers] = useState([
                { id: 1, name: '스마트개미', role: '👑 팀장', provider: '카카오', pnlRate: 18.5, capitalKrw: 15000000, mainSymbol: '$삼성전자', avatar: '🎩' },
                { id: 2, name: '박비트', role: '⚡ 에이스 트레이더', provider: '네이버', pnlRate: 12.4, capitalKrw: 8500000, mainSymbol: '$BTC', avatar: '🐱' },
                { id: 3, name: '최솔라', role: '🛡️ 리스크 매니저', provider: '구글', pnlRate: 9.6, capitalKrw: 5200000, mainSymbol: '$SOL', avatar: '🦊' },
                { id: 4, name: '김엔비', role: '📈 해외주식 분석가', provider: '카카오', pnlRate: 15.2, capitalKrw: 8300000, mainSymbol: '$NVDA', avatar: '🦁' }
            ]);

            // Active Navigation Tab: 'portfolio', 'team', 'strategy', 'journal', 'social'
            const [activeTab, setActiveTab] = useState('portfolio');
            const [showGuideModal, setShowGuideModal] = useState(false);
            const [createTeamModalOpen, setCreateTeamModalOpen] = useState(false);
            const [joinTeamModalOpen, setJoinTeamModalOpen] = useState(false);
            const [inviteModalOpen, setInviteModalOpen] = useState(false);
            const [journalFormOpen, setJournalFormOpen] = useState(false);

            // Form States
            const [newTeamNameInput, setNewTeamNameInput] = useState('');
            const [newTeamGoalInput, setNewTeamGoalInput] = useState('50000000');
            const [joinCodeInput, setJoinCodeInput] = useState('');
            const [copiedNotice, setCopiedNotice] = useState(false);

            // Holdings & Trade Data
            const [holdings, setHoldings] = useState([
                { id: 1, name: '삼성전자', symbol: '$삼성전자', category: '📈 주식', qty: 150, avgPrice: 66300, currentPrice: 72000, evalAmount: 10800000, pnlRate: 8.5 },
                { id: 2, name: '비트코인', symbol: '$BTC', category: '🪙 코인', qty: 0.025, avgPrice: 120000000, currentPrice: 135000000, evalAmount: 3375000, pnlRate: 12.4 },
                { id: 3, name: '엔비디아', symbol: '$NVDA', category: '📈 해외주식', qty: 10, avgPrice: 160000, currentPrice: 184320, evalAmount: 1843200, pnlRate: 15.2 }
            ]);

            const [strategies, setStrategies] = useState([
                { id: 1, name: '💎 기업 실질가치 장기분석', weight: '60%', targetPnl: '+25.0%', risk: '보통', description: '영업이익 및 PBR 1.0 이하 펀더멘털 우수 종목 장기 보유' },
                { id: 2, name: '⚡ 김프 차익 스캘핑', weight: '25%', targetPnl: '+15.0%', risk: '높음', description: '가상자산 해외 대형 거래소 차익 스캘핑 전략' }
            ]);

            const [tradeLogs, setTradeLogs] = useState([
                { id: 1, date: '2026-08-25', symbol: '$삼성전자', side: 'BUY', price: 72000, amountKrw: 1000000, pnlRate: 8.5, strategy: '💎 기업 실질가치 장기분석', aiAnalysis: '실적 반등 및 외국인 순매수세 지속' }
            ]);

            const [feed, setFeed] = useState([
                { id: 101, author: '스마트개미 (팀장)', badge: '카카오 1초 인증', symbol: '$삼성전자', side: 'BUY', amountKrw: 1000000, pnlRate: 8.5, strategy: '💎 실적 개선 펀더멘털 저점 매수', likes: 14, copiedCount: 5, time: '10분 전' },
                { id: 102, author: '박비트 (팀원)', badge: '네이버 1초 인증', symbol: '$BTC', side: 'BUY', amountKrw: 500000, pnlRate: 12.4, strategy: '⚡ 김프 0.04% 스캘핑 차익', likes: 9, copiedCount: 2, time: '25분 전' }
            ]);

            const [buildings, setBuildings] = useState([
                { id: 1, name: '삼성 주식 타워', symbol: '$삼성전자', level: 3, pnl: 8.5, iconClass: 'fa-solid fa-building-columns text-sky-600' },
                { id: 2, name: '비트코인 뱅크', symbol: '$BTC', level: 2, pnl: 12.4, iconClass: 'fa-solid fa-coins text-amber-500' }
            ]);

            // Form inputs
            const [promptText, setPromptText] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('📈 주식');
            const [manualSymbol, setManualSymbol] = useState('삼성전자');
            const [manualSide, setManualSide] = useState('BUY');
            const [manualAmount, setManualAmount] = useState('1000000');
            const [manualPrice, setManualPrice] = useState('72000');
            const [manualPnl, setManualPnl] = useState('8.5');
            const [manualStrategy, setManualStrategy] = useState('💎 기업 실질가치 장기분석');

            // 1-Second Social Auth Handler
            const handleSocialLogin = (providerName) => {
                setUser({
                    isLoggedIn: true,
                    provider: providerName,
                    nickname: `${providerName.toUpperCase()}_스마트개미`,
                    avatar: providerName === 'kakao' ? '🟡' : providerName === 'naver' ? '🟢' : '🔵',
                    archetype: '💎 기업 실질가치 장기투자자',
                    totalCapitalKrw: 15000000,
                    totalProfitKrw: 2775000,
                    returnPct: 18.5,
                    xp: 2450,
                    streak: 5
                });
                setActiveTab('portfolio');
            };

            const handleLogout = () => {
                setUser(prev => ({ ...prev, isLoggedIn: false }));
            };

            // Team Creation Handler
            const handleCreateTeamSubmit = (e) => {
                e.preventDefault();
                if (!newTeamNameInput.trim()) return;

                const randomCode = 'TEAM' + Math.floor(100 + Math.random() * 900);
                setTeam({
                    id: Date.now(),
                    name: newTeamNameInput.trim(),
                    code: randomCode,
                    leader: user.nickname || '나',
                    membersCount: 1,
                    totalReturnPct: user.returnPct || 18.5,
                    targetCapitalKrw: Number(newTeamGoalInput),
                    currentCapitalKrw: user.totalCapitalKrw || 15000000
                });

                setTeamMembers([
                    { id: Date.now(), name: user.nickname || '나', role: '👑 팀장', provider: user.provider || '카카오', pnlRate: user.returnPct || 18.5, capitalKrw: user.totalCapitalKrw || 15000000, mainSymbol: '$삼성전자', avatar: user.avatar }
                ]);

                setNewTeamNameInput('');
                setCreateTeamModalOpen(false);
                alert(`🎉 새로운 소셜 트레이딩 팀 '${newTeamNameInput.trim()}'이 생성되었습니다!\n🔑 초대코드: ${randomCode}`);
            };

            // Join Team Handler
            const handleJoinTeamSubmit = (e) => {
                e.preventDefault();
                if (!joinCodeInput.trim()) return;

                const code = joinCodeInput.trim().toUpperCase();
                setTeam(prev => ({ ...prev, code: code, membersCount: prev.membersCount + 1 }));
                
                const newMember = {
                    id: Date.now(),
                    name: user.nickname || '신규 팀원',
                    role: '👥 팀원',
                    provider: user.provider || '소셜',
                    pnlRate: 15.0,
                    capitalKrw: 10000000,
                    mainSymbol: '$BTC',
                    avatar: '🌱'
                };
                setTeamMembers(prev => [...prev, newMember]);

                setJoinCodeInput('');
                setJoinTeamModalOpen(false);
                alert(`🎉 초대코드 '${code}' 팀 가입 성공! 팀원에 합류했습니다.`);
            };

            // Copy Invite Link Handler
            const handleCopyInviteLink = () => {
                const inviteUrl = `${window.location.origin}${window.location.pathname}?invite=${team.code}`;
                navigator.clipboard.writeText(inviteUrl);
                setCopiedNotice(true);
                setTimeout(() => setCopiedNotice(false), 3000);
            };

            // Prompt Submit
            const handlePromptSubmit = (e) => {
                e.preventDefault();
                if (!promptText.trim()) return;
                const text = promptText.trim();
                const detectedSymbol = text.includes('삼성') ? '$삼성전자' : text.includes('비트') ? '$BTC' : '$NVDA';

                setTradeLogs(prev => [{
                    id: Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    symbol: detectedSymbol,
                    side: text.includes('매도') ? 'SELL' : 'BUY',
                    price: 72000,
                    amountKrw: 1000000,
                    pnlRate: 6.8,
                    strategy: '💎 대화형 프롬프트 실시간 작성',
                    aiAnalysis: `자연어 '${text}' 감지 및 AI 실시간 분석 완료.`
                }, ...prev]);

                setBuildings(prev => [{
                    id: Date.now(),
                    name: `${detectedSymbol.replace('$', '')} 타워 Lv.1`,
                    symbol: detectedSymbol,
                    level: 1,
                    pnl: 6.8,
                    iconClass: 'fa-solid fa-building-columns text-sky-600'
                }, ...prev]);

                setPromptText('');
                alert(`🎉 [${detectedSymbol}] 매매 일지가 팀 피드에 공유되었습니다!`);
            };

            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <header className="bg-slate-900 text-white px-4 md:px-8 py-3.5 sticky top-0 z-50 shadow-md border-b border-slate-800 flex justify-between items-center font-jua">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setUser(prev => ({ ...prev, isLoggedIn: false }))}>
                            <div className="bg-gradient-to-tr from-indigo-500 to-sky-400 p-2.5 rounded-2xl shadow-sm flex items-center justify-center">
                                <i className="fa-solid fa-users-line text-white text-lg"></i>
                            </div>
                            <div>
                                <span className="font-black text-xl tracking-tight text-white">같이투자 <span className="text-xs text-sky-300 font-normal">팀 소셜 트레이딩</span></span>
                            </div>
                        </div>

                        <div className="flex items-center gap-2 text-xs">
                            <button onClick={() => setShowGuideModal(true)} className="bg-slate-800 hover:bg-slate-700 text-sky-300 font-bold px-3 py-1.5 rounded-xl border border-slate-700 transition flex items-center gap-1">
                                <i className="fa-solid fa-circle-question"></i>
                                <span>사용방법</span>
                            </button>

                            {user.isLoggedIn ? (
                                <div className="flex items-center gap-2">
                                    <div className="hidden sm:flex items-center gap-1.5 bg-indigo-950 text-sky-200 px-3 py-1.5 rounded-xl border border-indigo-700/60 font-mono">
                                        <span className="text-emerald-400 font-bold">+{user.returnPct}% PnL</span>
                                        <span>·</span>
                                        <span className="text-amber-400">{user.xp.toLocaleString()} EXP</span>
                                    </div>
                                    <div className="bg-slate-800 text-white font-bold px-3 py-1.5 rounded-xl border border-slate-700 flex items-center gap-1.5">
                                        <span>{user.avatar}</span>
                                        <span>{user.nickname}</span>
                                        <span className="bg-emerald-600 text-white text-[10px] px-1.5 py-0.5 rounded">{user.provider.toUpperCase()}</span>
                                    </div>
                                    <button onClick={handleLogout} className="bg-rose-950 text-rose-300 font-bold px-2.5 py-1.5 rounded-xl border border-rose-800 hover:bg-rose-900 transition">
                                        로그아웃
                                    </button>
                                </div>
                            ) : (
                                <span className="text-slate-400 font-bold">게스트 접속 중</span>
                            )}
                        </div>
                    </header>

                    {/* ========================================================================= */}
                    {/* SCREEN 1: LANDING PAGE (1초 소셜 로그인) */}
                    {/* ========================================================================= */}
                    {!user.isLoggedIn ? (
                        <div className="hero-bg min-h-[92vh] text-white flex flex-col justify-center items-center px-4 py-12 text-center space-y-8 font-jua">
                            <div className="space-y-3 max-w-2xl">
                                <span className="bg-indigo-500/20 text-sky-300 px-4 py-1.5 rounded-full text-xs font-bold border border-indigo-400/30">
                                    👥 팀 생성 및 친구 초대 기능 전면 탑재!
                                </span>
                                <h1 className="text-3xl md:text-5xl font-black text-white leading-tight">
                                    같이투자 <br/>
                                    <span className="bg-gradient-to-r from-sky-400 via-indigo-300 to-amber-300 bg-clip-text text-transparent">
                                        팀 매매일지 & 소셜 트레이딩 플랫폼
                                    </span>
                                </h1>
                                <p className="text-slate-300 text-sm md:text-base max-w-lg mx-auto font-normal">
                                    친구들과 <strong>팀을 만들어 같이투자</strong>하세요! 초대 코드로 조인하고 실전 손익률(% PnL)을 실시간 검증받으세요.
                                </p>
                            </div>

                            {/* Social Auth Login Card */}
                            <div className="white-card p-6 rounded-3xl max-w-md w-full text-slate-900 space-y-4 shadow-2xl border-2 border-indigo-300">
                                <h3 className="text-lg font-black text-slate-900 border-b border-slate-100 pb-2">🔑 1초 간편 소셜 로그인</h3>
                                <div className="space-y-3">
                                    <button onClick={() => handleSocialLogin('kakao')} className="w-full bg-[#FEE500] hover:brightness-105 text-[#191919] font-black text-sm py-3.5 rounded-2xl shadow-md flex items-center justify-center gap-2 transition">
                                        <i className="fa-solid fa-comment text-lg"></i>
                                        <span>카카오 1초 간편로그인</span>
                                    </button>
                                    <button onClick={() => handleSocialLogin('naver')} className="w-full bg-[#03C75A] hover:brightness-105 text-white font-black text-sm py-3.5 rounded-2xl shadow-md flex items-center justify-center gap-2 transition">
                                        <i className="fa-solid fa-N text-lg"></i>
                                        <span>네이버 1초 간편로그인</span>
                                    </button>
                                    <button onClick={() => handleSocialLogin('google')} className="w-full bg-white hover:bg-slate-50 text-slate-900 font-black text-sm py-3.5 rounded-2xl border border-slate-300 shadow-md flex items-center justify-center gap-2 transition">
                                        <i className="fa-brands fa-google text-lg text-rose-500"></i>
                                        <span>구글 1초 간편로그인</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* ========================================================================= */
                        /* SCREEN 2: MAIN PLATFORM DASHBOARD WITH TEAM & SQUAD SYSTEM */
                        /* ========================================================================= */
                        <main className="max-w-3xl mx-auto px-4 pt-6 pb-16 space-y-6 font-jua">

                            {/* Team Header Banner (팀 정보 & 초대 기능 전면 탑재) */}
                            <div className="white-card p-5 rounded-3xl space-y-3 border-2 border-indigo-200">
                                <div className="flex justify-between items-center text-xs">
                                    <div className="flex items-center gap-2">
                                        <span className="bg-slate-900 text-white px-3 py-1 rounded-full font-bold">👑 {team.name}</span>
                                        <span className="bg-indigo-50 text-indigo-900 px-3 py-1 rounded-full font-bold border border-indigo-200 font-mono">코드: {team.code}</span>
                                    </div>
                                    <div className="flex items-center gap-1.5">
                                        <button onClick={() => setInviteModalOpen(true)} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded-xl font-bold transition flex items-center gap-1 shadow-sm">
                                            <i className="fa-solid fa-user-plus text-xs"></i>
                                            <span>팀원 초대하기</span>
                                        </button>
                                        <button onClick={() => setCreateTeamModalOpen(true)} className="bg-indigo-950 hover:bg-indigo-900 text-indigo-200 px-2.5 py-1 rounded-xl font-bold border border-indigo-700/60 transition">
                                            + 팀 생성
                                        </button>
                                        <button onClick={() => setJoinTeamModalOpen(true)} className="bg-slate-800 hover:bg-slate-700 text-white px-2.5 py-1 rounded-xl font-bold border border-slate-700 transition">
                                            🔑 조인
                                        </button>
                                    </div>
                                </div>

                                <div className="flex justify-between items-end pt-1">
                                    <div className="space-y-1">
                                        <h2 className="text-xl font-black text-slate-900 flex items-center gap-2">
                                            <span>👥 같이투자 팀 대시보드</span>
                                            <span className="text-xs text-slate-500 font-normal">({team.membersCount}명 조인 중)</span>
                                        </h2>
                                        <p className="text-xs text-slate-500">팀원들과 함께 실전 손익률(% PnL)을 실시간으로 같이 관리합니다.</p>
                                    </div>
                                    <div className="text-right">
                                        <span className="text-[10px] text-slate-400 block font-bold">팀 평균 손익률</span>
                                        <span className="text-xl font-black text-emerald-600 font-mono">+{team.totalReturnPct}% PnL</span>
                                    </div>
                                </div>
                            </div>

                            {/* Main Navigation Bar */}
                            <div className="white-card p-2 rounded-2xl border border-slate-200 flex justify-around text-xs md:text-sm font-bold">
                                <button onClick={() => setActiveTab('portfolio')} className={activeTab === 'portfolio' ? 'bg-indigo-900 text-white px-3 py-2 rounded-xl transition shadow-sm flex items-center gap-1' : 'text-slate-600 hover:bg-slate-100 px-3 py-2 rounded-xl transition flex items-center gap-1'}>
                                    <i className="fa-solid fa-pie-chart"></i>
                                    <span>1. 투자종목</span>
                                </button>
                                <button onClick={() => setActiveTab('team')} className={activeTab === 'team' ? 'bg-indigo-900 text-white px-3 py-2 rounded-xl transition shadow-sm flex items-center gap-1' : 'text-slate-600 hover:bg-slate-100 px-3 py-2 rounded-xl transition flex items-center gap-1'}>
                                    <i className="fa-solid fa-users text-sky-400"></i>
                                    <span>2. 팀원 조인/목록 ({teamMembers.length})</span>
                                </button>
                                <button onClick={() => setActiveTab('strategy')} className={activeTab === 'strategy' ? 'bg-indigo-900 text-white px-3 py-2 rounded-xl transition shadow-sm flex items-center gap-1' : 'text-slate-600 hover:bg-slate-100 px-3 py-2 rounded-xl transition flex items-center gap-1'}>
                                    <i className="fa-solid fa-lightbulb"></i>
                                    <span>3. 투자전략</span>
                                </button>
                                <button onClick={() => setActiveTab('journal')} className={activeTab === 'journal' ? 'bg-indigo-900 text-white px-3 py-2 rounded-xl transition shadow-sm flex items-center gap-1' : 'text-slate-600 hover:bg-slate-100 px-3 py-2 rounded-xl transition flex items-center gap-1'}>
                                    <i className="fa-solid fa-book-bookmark"></i>
                                    <span>4. 매매일지</span>
                                </button>
                                <button onClick={() => setActiveTab('social')} className={activeTab === 'social' ? 'bg-indigo-900 text-white px-3 py-2 rounded-xl transition shadow-sm flex items-center gap-1' : 'text-slate-600 hover:bg-slate-100 px-3 py-2 rounded-xl transition flex items-center gap-1'}>
                                    <i className="fa-solid fa-retweet text-amber-400"></i>
                                    <span>5. 소셜피드</span>
                                </button>
                            </div>

                            {/* --------------------------------------------------------------------- */}
                            {/* TAB 1: 📊 투자종목 */}
                            {/* --------------------------------------------------------------------- */}
                            {activeTab === 'portfolio' && (
                                <div className="space-y-4">
                                    <div className="white-card p-6 rounded-3xl space-y-4 border-2 border-indigo-200">
                                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                            <div>
                                                <span className="text-slate-400 text-xs font-bold block">내 총 평가 자산</span>
                                                <h2 className="text-2xl font-black text-slate-900 font-mono">
                                                    {user.totalCapitalKrw.toLocaleString()}원
                                                </h2>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-slate-400 text-xs font-bold block">누적 손익</span>
                                                <h3 className="text-xl font-black text-emerald-600 font-mono">
                                                    +{user.totalProfitKrw.toLocaleString()}원 (+{user.returnPct}%)
                                                </h3>
                                            </div>
                                        </div>

                                        <div className="divide-y divide-slate-100 font-mono text-xs">
                                            {holdings.map(h => (
                                                <div key={h.id} className="py-3 flex justify-between items-center hover:bg-slate-50 px-2 rounded-xl font-jua">
                                                    <div>
                                                        <span className="font-bold text-slate-900 text-sm block">{h.name} <span className="text-xs text-indigo-900">({h.symbol})</span></span>
                                                        <span className="text-slate-400 text-[11px]">{h.category} · 수량: {h.qty}</span>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="font-bold text-slate-900 text-sm block font-mono">{h.evalAmount.toLocaleString()}원</span>
                                                        <span className="text-emerald-600 font-black font-mono">+{h.pnlRate}% PnL</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --------------------------------------------------------------------- */}
                            {/* TAB 2: 👥 팀원 조인 및 목록 (Team Roster & Members) */}
                            {/* --------------------------------------------------------------------- */}
                            {activeTab === 'team' && (
                                <div className="space-y-4 text-xs">
                                    <div className="white-card p-5 rounded-3xl space-y-3 border border-slate-200">
                                        <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                                            <div>
                                                <h3 className="font-black text-slate-900 text-sm">👥 '{team.name}' 조인 팀원 명단 ({teamMembers.length}명)</h3>
                                                <p className="text-[11px] text-slate-500">초대 코드로 참여한 팀원들의 실전 수익률 현황입니다.</p>
                                            </div>
                                            <button onClick={() => setInviteModalOpen(true)} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition flex items-center gap-1">
                                                <i className="fa-solid fa-user-plus text-xs"></i>
                                                <span>초대하기</span>
                                            </button>
                                        </div>

                                        <div className="space-y-3 pt-1">
                                            {teamMembers.map(m => (
                                                <div key={m.id} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 flex justify-between items-center">
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-2xl">{m.avatar}</span>
                                                        <div>
                                                            <div className="flex items-center gap-1.5">
                                                                <span className="font-bold text-slate-900 text-sm">{m.name}</span>
                                                                <span className="bg-indigo-950 text-indigo-200 text-[10px] px-2 py-0.5 rounded-full font-bold">{m.role}</span>
                                                            </div>
                                                            <span className="text-slate-400 text-[11px] block">{m.provider} 인증 · 대표 주력 종목: {m.mainSymbol}</span>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="text-emerald-600 font-black font-mono text-sm block">+{m.pnlRate}% PnL</span>
                                                        <span className="text-slate-400 font-mono text-[11px]">{m.capitalKrw.toLocaleString()}원</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --------------------------------------------------------------------- */}
                            {/* TAB 3: 💡 투자전략 */}
                            {/* --------------------------------------------------------------------- */}
                            {activeTab === 'strategy' && (
                                <div className="white-card p-5 rounded-3xl space-y-3 border border-slate-200 text-xs">
                                    <h3 className="font-black text-slate-900 text-sm border-b border-slate-100 pb-2">💡 팀원 공유 투자전략</h3>
                                    <div className="space-y-3">
                                        {strategies.map(s => (
                                            <div key={s.id} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-1">
                                                <div className="flex justify-between items-center">
                                                    <span className="font-bold text-slate-900 text-sm">{s.name}</span>
                                                    <span className="bg-indigo-100 text-indigo-900 px-2 py-0.5 rounded-full font-bold">비중 {s.weight}</span>
                                                </div>
                                                <p className="text-slate-600 text-xs">{s.description}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* --------------------------------------------------------------------- */}
                            {/* TAB 4: 📝 매매일지 */}
                            {/* --------------------------------------------------------------------- */}
                            {activeTab === 'journal' && (
                                <div className="space-y-4 text-xs">
                                    <div className="white-card p-4 rounded-3xl prompt-shadow border-2 border-indigo-200 space-y-3">
                                        <form onSubmit={handlePromptSubmit} className="flex items-center gap-2">
                                            <input
                                                type="text"
                                                value={promptText}
                                                onChange={(e) => setPromptText(e.target.value)}
                                                placeholder="예: '$삼성전자 100만원 매수' 또는 '$BTC 50만원 매수'..."
                                                required
                                                className="w-full bg-slate-50 text-slate-900 placeholder-slate-400 text-sm px-5 py-3.5 rounded-2xl focus:outline-none border border-slate-200"
                                            />
                                            <button type="submit" className="bg-slate-900 text-white font-black px-6 py-3.5 rounded-2xl text-sm shrink-0">
                                                기록
                                            </button>
                                        </form>
                                    </div>

                                    <div className="white-card p-5 rounded-3xl space-y-3 border border-slate-200">
                                        <h3 className="font-black text-slate-900 text-sm border-b border-slate-100 pb-2">📝 매매일지 히스토리</h3>
                                        {tradeLogs.map(log => (
                                            <div key={log.id} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-1">
                                                <div className="flex justify-between items-center font-bold">
                                                    <span>{log.symbol} {log.side}</span>
                                                    <span className="text-emerald-600 font-mono">+{log.pnlRate}% PnL</span>
                                                </div>
                                                <p className="text-slate-600 text-xs">{log.strategy}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* --------------------------------------------------------------------- */}
                            {/* TAB 5: 📈 소셜 피드 */}
                            {/* --------------------------------------------------------------------- */}
                            {activeTab === 'social' && (
                                <div className="space-y-4 text-xs">
                                    <div className="white-card p-5 rounded-3xl space-y-3 border border-slate-200">
                                        <h3 className="font-black text-slate-900 text-sm border-b border-slate-100 pb-2">📖 팀 실시간 소셜 피드</h3>
                                        {feed.map(item => (
                                            <div key={item.id} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                                                <div className="flex justify-between items-center">
                                                    <span className="font-bold text-slate-900 text-sm">{item.author}</span>
                                                    <span className="text-emerald-600 font-bold font-mono">+{item.pnlRate}% PnL</span>
                                                </div>
                                                <div className="text-slate-800 font-bold">{item.symbol} {item.amountKrw.toLocaleString()}원 매수</div>
                                                <button onClick={() => alert('🚀 팀원 전략 1클릭 카피 트레이딩 완료!')} className="bg-slate-900 text-white px-3 py-1.5 rounded-xl font-bold flex items-center gap-1">
                                                    <i className="fa-solid fa-retweet text-sky-400"></i>
                                                    <span>1클릭 카피 트레이딩</span>
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </main>
                    )}

                    {/* ========================================================================= */}
                    {/* MODAL 1: ➕ 팀 생성하기 모달 */}
                    {/* ========================================================================= */}
                    {createTeamModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border border-slate-200">
                                <button onClick={() => setCreateTeamModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="text-lg font-black text-slate-900">👑 새로운 소셜 트레이딩 팀 생성</h3>
                                <form onSubmit={handleCreateTeamSubmit} className="space-y-3 text-xs">
                                    <div>
                                        <label className="text-slate-600 block mb-1">팀 이름 입력</label>
                                        <input
                                            type="text"
                                            value={newTeamNameInput}
                                            onChange={(e) => setNewTeamNameInput(e.target.value)}
                                            placeholder="예: 같이투자 2기 챔피언 팀"
                                            required
                                            className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-slate-600 block mb-1">팀 목표 평가 금액 (KRW)</label>
                                        <input
                                            type="number"
                                            value={newTeamGoalInput}
                                            onChange={(e) => setNewTeamGoalInput(e.target.value)}
                                            required
                                            className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl"
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-slate-900 text-white font-bold py-3.5 rounded-2xl text-xs shadow-md">
                                        팀 생성 및 초대 코드 발급받기
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ========================================================================= */}
                    {/* MODAL 2: 🔑 팀 조인하기 모달 */}
                    {/* ========================================================================= */}
                    {joinTeamModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border border-slate-200">
                                <button onClick={() => setJoinTeamModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="text-lg font-black text-slate-900">🔑 초대 코드로 팀 조인하기</h3>
                                <form onSubmit={handleJoinTeamSubmit} className="space-y-3 text-xs">
                                    <div>
                                        <label className="text-slate-600 block mb-1">6자리 팀 초대 코드</label>
                                        <input
                                            type="text"
                                            value={joinCodeInput}
                                            onChange={(e) => setJoinCodeInput(e.target.value)}
                                            placeholder="예: GACHI7"
                                            required
                                            className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl uppercase font-mono"
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-900 text-white font-bold py-3.5 rounded-2xl text-xs shadow-md">
                                        팀에 조인하기
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ========================================================================= */}
                    {/* MODAL 3: 🔗 팀원 초대하기 모달 */}
                    {/* ========================================================================= */}
                    {inviteModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-center relative border border-slate-200">
                                <button onClick={() => setInviteModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl mx-auto">
                                    <i className="fa-solid fa-user-plus"></i>
                                </div>
                                <div>
                                    <h3 className="text-lg font-black text-slate-900">👥 팀원 초대하기</h3>
                                    <p className="text-xs text-slate-500">초대 코드를 공유하여 친구를 내 팀으로 조인시키세요!</p>
                                </div>

                                <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                                    <span className="text-slate-400 text-xs font-bold block">팀 전용 6자리 초대 코드</span>
                                    <div className="text-2xl font-black text-slate-900 font-mono tracking-wider">
                                        {team.code}
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <button onClick={handleCopyInviteLink} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl text-xs shadow-md flex items-center justify-center gap-1.5 transition">
                                        <i className="fa-solid fa-link"></i>
                                        <span>{copiedNotice ? '✅ 초대 링크 복사 완료!' : '팀 초대 전용 링크 복사하기'}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
