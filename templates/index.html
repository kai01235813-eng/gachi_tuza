<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>같이투자 - 포춘시티 투자 도시 플랫폼</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for React JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; background-color: #f8fafc; color: #0f172a; }
        .font-jua { font-family: 'Jua', sans-serif; }
        .white-card { background: #ffffff; border: 1.5px solid #e2e8f0; box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05); }
        .city-grid { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); border: 2px dashed #cbd5e1; }
        .prompt-shadow { box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.15); }
        .ticker-tag { background: #e0e7ff; color: #3730a3; font-weight: 700; padding: 2px 8px; border-radius: 8px; }
        .building-hover { transition: all 0.2s ease-in-out; }
        .building-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.15); }
    </style>
</head>
<body class="bg-gradient-to-br from-[#f8fafc] via-[#f1f5f9] to-[#e2e8f0] min-h-screen pb-20 selection:bg-indigo-900 selection:text-white">

    <!-- React App Root Container -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Main Clean Fortune City Gamified Platform ---
        function App() {
            // User & Profile State
            const [user, setUser] = useState({
                id: 1,
                nickname: '스마트개미',
                avatar: '🎩',
                avatarTitle: '자산가 고양이',
                level: 12,
                xp: 2450,
                streak: 5
            });

            const [guild, setGuild] = useState({
                name: '같이투자 포춘 길드',
                code: 'GACHI7',
                membersCount: 8,
                totalReturnPct: 14.8
            });

            // Virtual City Buildings Grid State
            const [buildings, setBuildings] = useState([
                { id: 1, name: '🏢 삼성 주식 타워', symbol: '$삼성전자', type: '주식', level: 3, pnl: 8.5, icon: '🏢', bg: 'bg-indigo-50 border-indigo-200' },
                { id: 2, name: '🪙 비트코인 뱅크', symbol: '$BTC', type: '코인', level: 2, pnl: 12.4, icon: '🪙', bg: 'bg-amber-50 border-amber-200' },
                { id: 3, name: '🏰 가치 시청 (랜드마크)', symbol: '본부', type: '랜드마크', level: 5, pnl: 18.5, icon: '🏰', bg: 'bg-emerald-50 border-emerald-200' },
                { id: 4, name: '⚡ 솔라나 센터', symbol: '$SOL', type: '코인', level: 1, pnl: -4.2, icon: '⚡', bg: 'bg-rose-50 border-rose-200' }
            ]);

            const [selectedAsset, setSelectedAsset] = useState('📈 주식');
            const [sentiment, setSentiment] = useState('BULLISH');
            const [promptText, setPromptText] = useState('');

            // Stream of User Activity Log
            const [activityLog, setActivityLog] = useState([]);

            // Social Feed Cards
            const [feed, setFeed] = useState([
                {
                    id: 101,
                    author: '스마트개미',
                    avatar: '🎩',
                    buildingConstructed: '🏢 삼성 주식 타워 Lv.3',
                    asset_type: '📈 주식',
                    symbol: '$삼성전자',
                    side: 'BUY',
                    sentiment: 'BULLISH',
                    amount_krw: 1000000,
                    price: 72000,
                    pnl_rate: 8.5,
                    emotion: '😊 신난 미소',
                    strategy: '💎 실적 개선 펀더멘털 저점 매수',
                    likes: 14,
                    commentsCount: 3,
                    time: '10분 전'
                },
                {
                    id: 102,
                    author: '박비트',
                    avatar: '🐱',
                    buildingConstructed: '🪙 비트코인 뱅크 Lv.2',
                    asset_type: '🪙 코인',
                    symbol: '$BTC',
                    side: 'BUY',
                    sentiment: 'BULLISH',
                    amount_krw: 500000,
                    price: 135000000,
                    pnl_rate: 12.4,
                    emotion: '🚀 럭셔리 신남',
                    strategy: '⚡ 김프 0.04% 스캘핑 차익',
                    likes: 9,
                    commentsCount: 1,
                    time: '25분 전'
                }
            ]);

            // Town Race Leaderboard
            const [rankings, setRankings] = useState([
                { rank: 1, name: '스마트개미', avatar: '🎩', mainBuilding: '🏰 가치 시청 Lv.5', return_pct: 18.5, xp: 2450, streak: 5 },
                { rank: 2, name: '박비트', avatar: '🐱', mainBuilding: '🪙 비트코인 뱅크 Lv.2', return_pct: 12.4, xp: 1980, streak: 3 },
                { rank: 3, name: '최솔라', avatar: '🦊', mainBuilding: '⚡ 솔라나 센터 Lv.1', return_pct: 9.6, xp: 1620, streak: 7 }
            ]);

            const [activeTab, setActiveTab] = useState('city'); // 'city', 'feed', 'race'
            const [profileModalOpen, setProfileModalOpen] = useState(false);
            const [loginModalOpen, setLoginModalOpen] = useState(false);
            const [createGuildOpen, setCreateGuildOpen] = useState(false);
            const [joinGuildOpen, setJoinGuildOpen] = useState(false);
            const [journalFormOpen, setJournalFormOpen] = useState(false);

            // Form Inputs
            const [editNameInput, setEditNameInput] = useState(user.nickname);
            const [editAvatarInput, setEditAvatarInput] = useState(user.avatar);
            const [guildNameInput, setGuildNameInput] = useState('');
            const [joinCodeInput, setJoinCodeInput] = useState('');

            // Detailed Journal Input
            const [manualSymbol, setManualSymbol] = useState('삼성전자');
            const [manualSide, setManualSide] = useState('BUY');
            const [manualAmount, setManualAmount] = useState('100000');
            const [manualPrice, setManualPrice] = useState('72000');
            const [manualPnl, setManualPnl] = useState('5.0');
            const [manualStrategy, setManualStrategy] = useState('💎 기업 실질가치 장기분석');

            // Handle Prompt Submission (Construct New Building in City)
            const handleSendPrompt = (e) => {
                e.preventDefault();
                if (!promptText.trim()) return;

                const text = promptText.trim();
                const isBuy = text.includes('매수') || text.includes('샀') || sentiment === 'BULLISH';
                const side = isBuy ? 'BUY' : 'SELL';
                const detectedSymbol = text.includes('삼성') ? '$삼성전자' : text.includes('비트') ? '$BTC' : text.includes('솔라') ? '$SOL' : '$NVDA';

                const newXp = user.xp + 150;
                const newStreak = user.streak + 1;
                setUser(prev => ({ ...prev, xp: newXp, streak: newStreak }));

                const buildingName = detectedSymbol === '$삼성전자' ? '🏢 삼성 주식 타워' : detectedSymbol === '$BTC' ? '🪙 비트코인 뱅크' : '⚡ 엔비디아 데이터 센터';
                
                const newBuilding = {
                    id: Date.now(),
                    name: `${buildingName} Lv.1`,
                    symbol: detectedSymbol,
                    type: selectedAsset === '📈 주식' ? '주식' : '코인',
                    level: 1,
                    pnl: 6.8,
                    icon: selectedAsset === '📈 주식' ? '🏢' : '🪙',
                    bg: 'bg-indigo-50 border-indigo-200'
                };
                setBuildings(prev => [newBuilding, ...prev]);

                const newLog = {
                    id: Date.now(),
                    text: `🎉 '${buildingName} Lv.1' 건설 완료! (+150 EXP | 🔥 ${newStreak}일 스트릭)`
                };
                setActivityLog(prev => [newLog, ...prev]);

                const newFeedItem = {
                    id: Date.now(),
                    author: user.nickname,
                    avatar: user.avatar,
                    buildingConstructed: `${buildingName} Lv.1`,
                    asset_type: selectedAsset,
                    symbol: detectedSymbol,
                    side: side,
                    sentiment: sentiment,
                    amount_krw: 1000000,
                    price: 72000,
                    pnl_rate: 6.8,
                    emotion: '😊 신난 미소',
                    strategy: '💎 자연어 입력으로 신규 건물 건설',
                    likes: 1,
                    commentsCount: 0,
                    time: '방금 전'
                };
                setFeed(prev => [newFeedItem, ...prev]);
                setPromptText('');
            };

            const fillPrompt = (t) => { setPromptText(t); };

            const handleSaveProfile = (e) => {
                e.preventDefault();
                if (!editNameInput.trim()) return;
                setUser(prev => ({
                    ...prev,
                    nickname: editNameInput.trim(),
                    avatar: editAvatarInput
                }));
                setProfileModalOpen(false);
            };

            const handleLogin = (provider) => {
                setUser(prev => ({
                    ...prev,
                    nickname: `${provider.toUpperCase()} 트레이더`
                }));
                setLoginModalOpen(false);
            };

            const handleCreateGuild = (e) => {
                e.preventDefault();
                if (!guildNameInput.trim()) return;
                const randomCode = 'GACHI' + Math.floor(100 + Math.random() * 900);
                setGuild({
                    name: guildNameInput.trim(),
                    code: randomCode,
                    membersCount: 1,
                    totalReturnPct: 0.0
                });
                setGuildNameInput('');
                setCreateGuildOpen(false);
            };

            const handleJoinGuild = (e) => {
                e.preventDefault();
                if (!joinCodeInput.trim()) return;
                setGuild(prev => ({
                    ...prev,
                    code: joinCodeInput.trim().toUpperCase(),
                    membersCount: prev.membersCount + 1
                }));
                setJoinCodeInput('');
                setJoinGroupOpen(false);
            };

            const handleManualJournalSubmit = (e) => {
                e.preventDefault();
                const newXp = user.xp + 200;
                setUser(prev => ({ ...prev, xp: newXp }));

                const buildingName = `🏢 ${manualSymbol} 타워 Lv.1`;
                const newBuilding = {
                    id: Date.now(),
                    name: buildingName,
                    symbol: `$${manualSymbol}`,
                    type: selectedAsset === '📈 주식' ? '주식' : '코인',
                    level: 1,
                    pnl: Number(manualPnl),
                    icon: '🏢',
                    bg: Number(manualPnl) >= 0 ? 'bg-indigo-50 border-indigo-200' : 'bg-rose-50 border-rose-200'
                };
                setBuildings(prev => [newBuilding, ...prev]);

                const newFeedItem = {
                    id: Date.now(),
                    author: user.nickname,
                    avatar: user.avatar,
                    buildingConstructed: buildingName,
                    asset_type: selectedAsset,
                    symbol: `$${manualSymbol}`,
                    side: manualSide,
                    sentiment: manualSide === 'BUY' ? 'BULLISH' : 'BEARISH',
                    amount_krw: Number(manualAmount),
                    price: Number(manualPrice),
                    pnl_rate: Number(manualPnl),
                    emotion: Number(manualPnl) >= 0 ? '😊 신난 미소' : '😭 울먹임 (HP 80%)',
                    strategy: manualStrategy,
                    likes: 0,
                    commentsCount: 0,
                    time: '방금 전'
                };
                setFeed(prev => [newFeedItem, ...prev]);
                setJournalFormOpen(false);
            };

            const toggleLike = (id) => {
                setFeed(prev => prev.map(item => item.id === id ? { ...item, likes: item.likes + 1 } : item));
            };

            return (
                <div className="min-h-screen">
                    {/* Header Bar */}
                    <header className="bg-slate-900 text-white px-4 md:px-8 py-3.5 sticky top-0 z-50 shadow-md border-b border-slate-800 flex justify-between items-center">
                        <div className="flex items-center space-x-3">
                            <div className="bg-gradient-to-tr from-indigo-500 to-sky-400 p-2 rounded-2xl shadow-sm">
                                <i className="fa-solid fa-city text-white text-base"></i>
                            </div>
                            <span className="font-black text-xl font-jua tracking-tight text-white">같이투자 <span className="text-sky-300">🏙️ 포춘시티</span></span>
                        </div>

                        <div className="flex items-center gap-2 font-jua text-xs">
                            <div className="hidden sm:flex items-center gap-1 bg-amber-500/10 text-amber-400 px-3 py-1.5 rounded-xl border border-amber-500/30">
                                <span>🔥 {user.streak}일 스트릭</span>
                            </div>
                            <div className="bg-indigo-950/80 text-indigo-200 px-3 py-1.5 rounded-xl border border-indigo-700/60 flex items-center gap-1">
                                <i className="fa-solid fa-trophy text-amber-400"></i>
                                <span>{user.xp.toLocaleString()} EXP</span>
                            </div>
                            <button onClick={() => setProfileModalOpen(true)} className="bg-gradient-to-r from-indigo-500 to-sky-400 text-white font-bold px-3.5 py-1.5 rounded-xl shadow-md hover:brightness-110 transition flex items-center gap-1.5">
                                <span className="text-sm">{user.avatar}</span>
                                <span>{user.nickname}</span>
                                <i className="fa-solid fa-gear text-[10px] opacity-80"></i>
                            </button>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main className="max-w-2xl mx-auto px-4 pt-6 pb-12 space-y-6">

                        {/* Guild Status Header */}
                        <div className="white-card p-5 rounded-3xl space-y-3 border border-slate-200">
                            <div className="flex justify-between items-center font-jua text-xs">
                                <div className="flex items-center gap-2">
                                    <span className="bg-slate-900 text-white px-3 py-1 rounded-full font-bold">🏰 {guild.name}</span>
                                    <span className="bg-indigo-50 text-indigo-900 px-3 py-1 rounded-full font-bold border border-indigo-200">코드: {guild.code}</span>
                                </div>
                                <div className="flex items-center gap-1.5 text-slate-600">
                                    <button onClick={() => setCreateGuildOpen(true)} className="hover:text-indigo-900 font-bold underline">길드 생성</button>
                                    <span>·</span>
                                    <button onClick={() => setJoinGuildOpen(true)} className="hover:text-indigo-900 font-bold underline">코드 참여</button>
                                </div>
                            </div>
                            <div className="flex justify-between items-center font-jua pt-1">
                                <div>
                                    <h1 className="text-xl font-black text-slate-900">나만의 투자 도시 (Investment City)</h1>
                                    <p className="text-xs text-slate-500">주식/코인 매수 시 건물 카드가 도시에 건축됩니다.</p>
                                </div>
                                <div className="text-right">
                                    <span className="text-[10px] text-slate-400 block font-bold">건물 수</span>
                                    <span className="text-lg font-black text-indigo-900 font-mono">🏢 {buildings.length}개</span>
                                </div>
                            </div>
                        </div>

                        {/* ZERO UI Building Construction Prompt */}
                        <div className="white-card p-4 rounded-3xl prompt-shadow border-2 border-indigo-200 space-y-3">
                            <div className="flex items-center justify-between font-jua text-xs border-b border-slate-100 pb-2.5">
                                <div className="flex items-center gap-2">
                                    <span className="text-slate-400 font-bold">🎯 건설 자산:</span>
                                    <button type="button" onClick={() => setSelectedAsset('📈 주식')} className={selectedAsset === '📈 주식' ? 'bg-slate-900 text-white px-3 py-1 rounded-xl font-bold transition' : 'bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1 rounded-xl font-bold transition'}>
                                        📈 주식 타워
                                    </button>
                                    <button type="button" onClick={() => setSelectedAsset('🪙 코인')} className={selectedAsset === '🪙 코인' ? 'bg-slate-900 text-white px-3 py-1 rounded-xl font-bold transition' : 'bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1 rounded-xl font-bold transition'}>
                                        🪙 코인 뱅크
                                    </button>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button type="button" onClick={() => setSentiment('BULLISH')} className={sentiment === 'BULLISH' ? 'bg-emerald-600 text-white px-2.5 py-1 rounded-xl font-bold transition text-[11px]' : 'bg-slate-100 text-slate-600 px-2.5 py-1 rounded-xl font-bold transition text-[11px]'}>
                                        🐂 매수
                                    </button>
                                    <button type="button" onClick={() => setSentiment('BEARISH')} className={sentiment === 'BEARISH' ? 'bg-rose-600 text-white px-2.5 py-1 rounded-xl font-bold transition text-[11px]' : 'bg-slate-100 text-slate-600 px-2.5 py-1 rounded-xl font-bold transition text-[11px]'}>
                                        🐻 매도
                                    </button>
                                    <button onClick={() => setJournalFormOpen(true)} className="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1 rounded-xl font-bold transition text-[11px]">
                                        ✏️ 상세 일지
                                    </button>
                                </div>
                            </div>

                            <form onSubmit={handleSendPrompt} className="flex items-center gap-2">
                                <input
                                    type="text"
                                    value={promptText}
                                    onChange={(e) => setPromptText(e.target.value)}
                                    placeholder="'$삼성전자 100만원 매수' 또는 '$BTC 50만원 매수'..."
                                    required
                                    className="w-full bg-slate-50 text-slate-900 placeholder-slate-400 text-sm px-5 py-3.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-200 font-jua"
                                />
                                <button type="submit" className="bg-gradient-to-r from-slate-900 via-indigo-900 to-slate-900 hover:from-slate-800 hover:to-indigo-800 text-white font-black px-6 py-3.5 rounded-2xl transition font-jua text-sm flex items-center gap-1.5 shrink-0 shadow-md active:scale-95">
                                    <span>건축</span>
                                    <i className="fa-solid fa-hammer text-xs"></i>
                                </button>
                            </form>

                            <div className="flex flex-wrap gap-2 px-1 text-xs font-jua">
                                <span className="text-slate-400 text-[11px] flex items-center">💡 빠른 입력:</span>
                                <button type="button" onClick={() => fillPrompt('$삼성전자 100만원 매수했어')} className="bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1 rounded-xl border border-slate-200 text-[11px] transition">
                                    📈 "$삼성전자 100만원 매수"
                                </button>
                                <button type="button" onClick={() => fillPrompt('$BTC 50만원 매수했어')} className="bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1 rounded-xl border border-slate-200 text-[11px] transition">
                                    🪙 "$BTC 50만원 매수"
                                </button>
                            </div>
                        </div>

                        {/* Recent Construction Logs Stream */}
                        {activityLog.length > 0 && (
                            <div className="space-y-2 font-jua text-xs">
                                {activityLog.map(log => (
                                    <div key={log.id} className="p-3 bg-emerald-50 text-emerald-900 rounded-2xl border border-emerald-200 flex justify-between items-center">
                                        <span>{log.text}</span>
                                        <span className="text-[10px] text-emerald-600">방금 전</span>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* Main Tabs */}
                        <div className="white-card p-5 rounded-3xl space-y-4 border border-slate-200">
                            <div className="flex justify-between items-center border-b border-slate-100 pb-3 font-jua">
                                <div className="flex items-center gap-3 text-xs font-bold">
                                    <button onClick={() => setActiveTab('city')} className={activeTab === 'city' ? 'text-indigo-900 border-b-2 border-indigo-900 pb-1.5 font-bold' : 'text-slate-400 hover:text-slate-700 pb-1.5'}>
                                        🏙️ 내 포춘시티 건물 지도 ({buildings.length})
                                    </button>
                                    <button onClick={() => setActiveTab('feed')} className={activeTab === 'feed' ? 'text-indigo-900 border-b-2 border-indigo-900 pb-1.5 font-bold' : 'text-slate-400 hover:text-slate-700 pb-1.5'}>
                                        📖 트레이딩 피드
                                    </button>
                                    <button onClick={() => setActiveTab('race')} className={activeTab === 'race' ? 'text-indigo-900 border-b-2 border-indigo-900 pb-1.5 font-bold' : 'text-slate-400 hover:text-slate-700 pb-1.5'}>
                                        🏁 마을 경주 랭킹
                                    </button>
                                </div>
                            </div>

                            {/* TAB 1: City Buildings Grid */}
                            {activeTab === 'city' && (
                                <div className="grid grid-cols-2 gap-3 font-jua text-xs">
                                    {buildings.map(b => (
                                        <div key={b.id} className={`p-4 rounded-2xl border ${b.bg} building-hover space-y-2 relative overflow-hidden`}>
                                            <div className="flex justify-between items-center">
                                                <span className="text-2xl">{b.icon}</span>
                                                <span className="bg-slate-900 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">Lv.{b.level}</span>
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-slate-900 text-sm">{b.name}</h4>
                                                <span className="text-slate-500 text-[11px]">{b.symbol} · {b.type}</span>
                                            </div>
                                            <div className="flex justify-between items-center pt-1 border-t border-slate-200/60">
                                                <span className="text-slate-400 text-[10px]">수익률</span>
                                                <span className={b.pnl >= 0 ? 'text-emerald-600 font-black font-mono' : 'text-rose-600 font-black font-mono'}>
                                                    {b.pnl >= 0 ? `+${b.pnl}%` : `${b.pnl}%`}
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* TAB 2: Social Trading Feed */}
                            {activeTab === 'feed' && (
                                <div className="space-y-4 font-jua text-xs">
                                    {feed.map(item => (
                                        <div key={item.id} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                                            <div className="flex justify-between items-center">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-base">{item.avatar}</span>
                                                    <span className="font-bold text-slate-900">{item.author}</span>
                                                    <span className="bg-indigo-100 text-indigo-900 text-[10px] px-2 py-0.5 rounded-full font-bold">{item.buildingConstructed}</span>
                                                </div>
                                                <span className="text-slate-400 text-[10px] font-mono">{item.time}</span>
                                            </div>

                                            <div className="flex justify-between items-center">
                                                <div className="text-slate-900 font-bold text-sm">
                                                    <span className="ticker-tag mr-2">{item.symbol}</span>
                                                    <span>{item.amount_krw.toLocaleString()}원 {item.side === 'BUY' ? '매수' : '매도'} ({item.price.toLocaleString()}원)</span>
                                                </div>
                                                <div className="flex items-center gap-1 bg-white px-2.5 py-1 rounded-xl border border-slate-200">
                                                    <span className="text-xs">{item.emotion}</span>
                                                    <span className={item.pnl_rate >= 0 ? 'text-emerald-600 font-black font-mono text-xs' : 'text-rose-600 font-black font-mono text-xs'}>
                                                        {item.pnl_rate >= 0 ? `+${item.pnl_rate}%` : `${item.pnl_rate}%`}
                                                    </span>
                                                </div>
                                            </div>

                                            <div className="text-slate-700 text-xs bg-white p-2.5 rounded-xl border border-slate-200/80">
                                                💡 <strong>건축 및 전략:</strong> {item.strategy}
                                            </div>

                                            <div className="flex items-center justify-between pt-1 text-slate-500 text-xs">
                                                <button onClick={() => toggleLike(item.id)} className="flex items-center gap-1 hover:text-indigo-900 transition">
                                                    <i className="fa-regular fa-thumbs-up"></i>
                                                    <span>응원하기 {item.likes}</span>
                                                </button>
                                                <button className="flex items-center gap-1 hover:text-indigo-900 transition">
                                                    <i className="fa-regular fa-comment"></i>
                                                    <span>댓글 {item.commentsCount}</span>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* TAB 3: Race Leaderboard */}
                            {activeTab === 'race' && (
                                <div className="space-y-3 font-jua text-xs">
                                    {rankings.map(item => (
                                        <div key={item.rank} className="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 flex items-center justify-between">
                                            <div className="flex items-center gap-3">
                                                <span className="font-black text-slate-900 text-sm w-5">{item.rank}위</span>
                                                <span className="text-xl">{item.avatar}</span>
                                                <div>
                                                    <span className="font-bold text-slate-900 text-sm">{item.name}</span>
                                                    <span className="text-slate-400 text-[11px] block">{item.mainBuilding}</span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <span className={item.return_pct >= 0 ? 'text-emerald-600 font-black font-mono text-sm block' : 'text-rose-600 font-black font-mono text-sm block'}>
                                                    {item.return_pct >= 0 ? `+${item.return_pct}%` : `${item.return_pct}%`}
                                                </span>
                                                <span className="text-rose-600 text-[11px] font-bold">🔥 {item.streak}일 스트릭</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>

                    {/* 프로필 & 닉네임 변경 모달 */}
                    {profileModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border border-slate-200">
                                <button onClick={() => setProfileModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="text-lg font-black text-slate-900">👤 내 프로필 및 아바타 변경</h3>
                                <form onSubmit={handleSaveProfile} className="space-y-4 text-xs">
                                    <div>
                                        <label className="text-slate-600 block mb-1 font-bold">내 닉네임 설정</label>
                                        <input
                                            type="text"
                                            value={editNameInput}
                                            onChange={(e) => setEditNameInput(e.target.value)}
                                            placeholder="예: 스마트개미, 버핏후예"
                                            required
                                            className="w-full bg-slate-50 border border-slate-200 text-sm px-4 py-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-slate-600 block mb-1 font-bold">아바타 선택</label>
                                        <div className="grid grid-cols-4 gap-2 text-center text-xl">
                                            {['🎩', '🐱', '🦊', '🌱'].map(emoji => (
                                                <button
                                                    key={emoji}
                                                    type="button"
                                                    onClick={() => setEditAvatarInput(emoji)}
                                                    className={editAvatarInput === emoji ? 'p-3 bg-indigo-100 border-2 border-indigo-500 rounded-2xl' : 'p-3 bg-slate-50 border border-slate-200 rounded-2xl hover:bg-slate-100'}
                                                >
                                                    {emoji}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-slate-900 text-white font-bold py-3.5 rounded-2xl shadow-md text-xs">
                                        프로필 저장하기
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 길드 생성 모달 */}
                    {createGuildOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border border-slate-200">
                                <button onClick={() => setCreateGuildOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="text-lg font-black text-slate-900">👑 새로운 투자 길드 생성</h3>
                                <form onSubmit={handleCreateGuild} className="space-y-3">
                                    <label className="text-xs text-slate-600 block">길드 이름</label>
                                    <input
                                        type="text"
                                        value={guildNameInput}
                                        onChange={(e) => setGuildNameInput(e.target.value)}
                                        placeholder="예: 같이투자 포춘 길드"
                                        required
                                        className="w-full bg-slate-50 border border-slate-200 text-sm px-4 py-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />
                                    <button type="submit" className="w-full bg-slate-900 text-white font-bold text-xs py-3.5 rounded-2xl shadow-md">
                                        길드 생성하기
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 길드 가입 모달 */}
                    {joinGuildOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border border-slate-200">
                                <button onClick={() => setJoinGuildOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="text-lg font-black text-slate-900">🔑 길드 초대코드 입력</h3>
                                <form onSubmit={handleJoinGuild} className="space-y-3">
                                    <label className="text-xs text-slate-600 block">6자리 초대 코드</label>
                                    <input
                                        type="text"
                                        value={joinCodeInput}
                                        onChange={(e) => setJoinCodeInput(e.target.value)}
                                        placeholder="예: GACHI7"
                                        required
                                        className="w-full bg-slate-50 border border-slate-200 text-sm px-4 py-3 rounded-2xl uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />
                                    <button type="submit" className="w-full bg-indigo-900 text-white font-bold text-xs py-3.5 rounded-2xl shadow-md">
                                        길드 가입하기
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 상세 매매 일지 작성 모달 */}
                    {journalFormOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border border-slate-200 max-h-[90vh] overflow-y-auto">
                                <button onClick={() => setJournalFormOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="text-lg font-black text-slate-900">✏️ 상세 매매 기록 양식</h3>
                                <form onSubmit={handleManualJournalSubmit} className="space-y-3 text-xs">
                                    <div>
                                        <label className="text-slate-600 block mb-1">종목명</label>
                                        <input type="text" value={manualSymbol} onChange={(e) => setManualSymbol(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-slate-600 block mb-1">구분</label>
                                            <select value={manualSide} onChange={(e) => setManualSide(e.target.value)} className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl">
                                                <option value="BUY">매수 (BUY)</option>
                                                <option value="SELL">매도 (SELL)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-slate-600 block mb-1">손익률 (% PnL)</label>
                                            <input type="number" step="0.1" value={manualPnl} onChange={(e) => setManualPnl(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-slate-600 block mb-1">금액 (KRW)</label>
                                            <input type="number" value={manualAmount} onChange={(e) => setManualAmount(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl" />
                                        </div>
                                        <div>
                                            <label className="text-slate-600 block mb-1">체결가 (KRW)</label>
                                            <input type="number" value={manualPrice} onChange={(e) => setManualPrice(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-slate-600 block mb-1">투자 전략</label>
                                        <input type="text" value={manualStrategy} onChange={(e) => setManualStrategy(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl" />
                                    </div>
                                    <button type="submit" className="w-full bg-slate-900 text-white font-bold py-3.5 rounded-2xl text-xs shadow-md">
                                        일지 등록 및 건물 건설 (+200 EXP)
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
