            const [journalFormOpen, setJournalFormOpen] = useState(false);

            // Portfolio Holdings Data
            const [holdings, setHoldings] = useState([

            const [strategies, setStrategies] = useState([

                { id: 2, name: '⚡ 김프 차익 스캘핑', weight: '25%', targetPnl: '+15.0%', risk: '높음', description: '가상자산 해외 대형 거래소 차익 스캘핑 전략' },
                { id: 3, name: '🛡️ 손실 방어 분할매수', weight: '15%', targetPnl: '+10.0%', risk: '낮음', description: '지수 조정 시 3단계 분할 매수 수호 전략' }
            ]);

            // Trading Journal History Logs
            const [tradeLogs, setTradeLogs] = useState([
                { id: 1, date: '2026-08-25', symbol: '$삼성전자', side: 'BUY', price: 72000, amountKrw: 1000000, pnlRate: 8.5, strategy: '💎 기업 실질가치 장기분석', aiAnalysis: '실적 반등 및 외국인 순매수세 지속' },
                { id: 2, date: '2026-08-24', symbol: '$BTC', side: 'BUY', price: 135000000, amountKrw: 500000, pnlRate: 12.4, strategy: '⚡ 김프 차익 스캘핑', aiAnalysis: 'ETF 자금 유입 및 프리미엄 회복' },
                { id: 3, date: '2026-08-22', symbol: '$SOL', side: 'SELL', price: 240000, amountKrw: 300000, pnlRate: -4.2, strategy: '🛡️ 손실 방어 분할매수', aiAnalysis: '단기 저항선 도달에 따른 일부 차익 실현' }

            // Real Social Feed Data (StockTwits + eToro)
            const [feed, setFeed] = useState([
                { id: 101, author: '스마트개미 (모임장)', badge: '카카오 1초 인증', symbol: '$삼성전자', side: 'BUY', amountKrw: 1000000, pnlRate: 8.5, strategy: '💎 실적 개선 펀더멘털 저점 매수', likes: 14, copiedCount: 5, time: '10분 전' },
                { id: 102, author: '박비트 (가치투자가)', badge: '네이버 1초 인증', symbol: '$BTC', side: 'BUY', amountKrw: 500000, pnlRate: 12.4, strategy: '⚡ 김프 0.04% 스캘핑 차익', likes: 9, copiedCount: 2, time: '25분 전' }

            // Fortune City Gamification Buildings
            const [buildings, setBuildings] = useState([
                { id: 1, name: '삼성 주식 타워', symbol: '$삼성전자', level: 3, pnl: 8.5, iconClass: 'fa-solid fa-building-columns text-sky-600' },

            ]);

            // Form States
            const [promptText, setPromptText] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('📈 주식');
            const [manualSymbol, setManualSymbol] = useState('삼성전자');
            const [manualSide, setManualSide] = useState('BUY');
            const [manualAmount, setManualAmount] = useState('1000000');
            const [manualPrice, setManualPrice] = useState('72000');
            const [manualPnl, setManualPnl] = useState('8.5');
            const [manualStrategy, setManualStrategy] = useState('💎 기업 실질가치 장기분석');

            // 1-Second Social Auth Handler
            const handleSocialLogin = (providerName) => {
                setUser({
                    isLoggedIn: true,
                    provider: providerName,
                    nickname: `${providerName.toUpperCase()}_스마트개미`,
                    avatar: providerName === 'kakao' ? '🟡' : providerName === 'naver' ? '🟢' : '🔵',

                    totalCapitalKrw: 15000000,
                    totalProfitKrw: 2775000,
                    returnPct: 18.5,
                    xp: 2450,
                    streak: 5

                setActiveTab('portfolio');
            };

            const handleLogout = () => {
                setUser(prev => ({ ...prev, isLoggedIn: false }));
            };

            // Natural Language Prompt Trade Input
            const handlePromptSubmit = (e) => {
                e.preventDefault();
                if (!promptText.trim()) return;

                const text = promptText.trim();
                const detectedSymbol = text.includes('삼성') ? '$삼성전자' : text.includes('비트') ? '$BTC' : '$NVDA';

                const newTrade = {
                    id: Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    symbol: detectedSymbol,
                    side: text.includes('매도') ? 'SELL' : 'BUY',
                    price: 72000,
                    amountKrw: 1000000,
                    pnlRate: 6.8,
                    strategy: '💎 대화형 프롬프트 실시간 작성',
                    aiAnalysis: `자연어 '${text}' 감지 및 AI 실시간 수급 분석 완료.`
                };

                setTradeLogs(prev => [newTrade, ...prev]);

                // Add Fortune City Building
                setBuildings(prev => [{
                    id: Date.now(),
                    name: `${detectedSymbol.replace('$', '')} 타워 Lv.1`,
                    symbol: detectedSymbol,
                    level: 1,
                    pnl: 6.8,
                    iconClass: 'fa-solid fa-building-columns text-sky-600'

                alert(`🎉 [${detectedSymbol}] 매매 일지가 등록되었으며, 포춘시티 새로운 건물이 생성되었습니다! (+150 EXP)`);
            };

            const handleManualJournalSubmit = (e) => {
                e.preventDefault();
                const newTrade = {
                    id: Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    symbol: `$${manualSymbol}`,
                    side: manualSide,
                    price: Number(manualPrice),
                    amountKrw: Number(manualAmount),
                    pnlRate: Number(manualPnl),
                    strategy: manualStrategy,
                    aiAnalysis: '상세 매매일지 등록 완료.'
                };
                setTradeLogs(prev => [newTrade, ...prev]);
                setJournalFormOpen(false);
                alert('🎉 상세 매매일지가 성공적으로 작성되었습니다! (+200 EXP)');
            };

            return (
                <div className="min-h-screen">

                            </div>

                            </div>
                        </div>

                                <i className="fa-solid fa-circle-question"></i>
                                <span>사용방법</span>
                            </button>

                            {user.isLoggedIn ? (
                                <div className="flex items-center gap-2">
                                    <div className="hidden sm:flex items-center gap-1.5 bg-indigo-950 text-sky-200 px-3 py-1.5 rounded-xl border border-indigo-700/60 font-mono">
                                        <span className="text-emerald-400 font-bold">+{user.returnPct}% PnL</span>
                                        <span>·</span>
                                        <span className="text-amber-400">{user.xp.toLocaleString()} EXP</span>
                                    </div>
                                    <div className="bg-slate-800 text-white font-bold px-3 py-1.5 rounded-xl border border-slate-700 flex items-center gap-1.5">
                                        <span>{user.avatar}</span>
                                        <span>{user.nickname}</span>
                                        <span className="bg-emerald-600 text-white text-[10px] px-1.5 py-0.5 rounded">{user.provider.toUpperCase()}</span>
                                    </div>
                                    <button onClick={handleLogout} className="bg-rose-950 text-rose-300 font-bold px-2.5 py-1.5 rounded-xl border border-rose-800 hover:bg-rose-900 transition">

                            <div className="space-y-3 max-w-2xl">
                                <span className="bg-indigo-500/20 text-sky-300 px-4 py-1.5 rounded-full text-xs font-bold border border-indigo-400/30">
                                    🚀 1초 간편 로그인으로 바로 시작하는 소셜 트레이딩
                                </span>

                                <div className="p-4 bg-slate-800/80 rounded-2xl border border-slate-700/80 space-y-1">
                                    <span className="text-2xl">📊</span>
                                    <h4 className="font-bold text-sky-300 text-sm">1. 나의 투자종목</h4>
                                    <p className="text-xs text-slate-400">보유 주식/코인 실시간 평가액 및 수익률 한눈에 관리</p>

                                    <h4 className="font-bold text-indigo-300 text-sm">2. 나의 투자전략</h4>
                                    <p className="text-xs text-slate-400">기업 가치분석/김프 스캘핑/분할매수 등 내 전략 설정</p>
                                </div>
                                <div className="p-4 bg-slate-800/80 rounded-2xl border border-slate-700/80 space-y-1">

                                    <h4 className="font-bold text-amber-300 text-sm">3. 매매일지 기록</h4>

                                    <p className="text-xs text-slate-400">검증된 고수의 매매를 1클릭으로 내 계좌로 복사</p>
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* ========================================================================= */
                        /* SCREEN 2: LOGGED IN MAIN PLATFORM DASHBOARD (4대 핵심 메뉴 탑재) */
                        /* ========================================================================= */
                        <main className="max-w-3xl mx-auto px-4 pt-6 pb-16 space-y-6 font-jua">

                                <button onClick={() => setActiveTab('strategy')} className={activeTab === 'strategy' ? 'bg-indigo-900 text-white px-4 py-2.5 rounded-xl transition shadow-sm flex items-center gap-1.5' : 'text-slate-600 hover:bg-slate-100 px-4 py-2.5 rounded-xl transition flex items-center gap-1.5'}>

                                    <span>3. 매매기록 / 일지</span>

                                                </h2>
                                            </div>

                                                <span className="text-slate-400 text-xs font-bold block">누적 투자 손익</span>
                                                <h3 className="text-xl font-black text-emerald-600 font-mono">
                                                    +{user.totalProfitKrw.toLocaleString()}원 (+{user.returnPct}%)

                                                <span className="text-sm font-bold text-rose-600">🔥 {user.streak}일</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Holdings Table */}
                                    <div className="white-card p-5 rounded-3xl space-y-3 border border-slate-200 text-xs">
                                        <h3 className="font-black text-slate-900 text-sm border-b border-slate-100 pb-2">
                                            📦 현재 보유 종목 리스트 ({holdings.length})
                                        </h3>
                                        <div className="divide-y divide-slate-100 font-mono">
                                            {holdings.map(h => (
                                                <div key={h.id} className="py-3 flex justify-between items-center hover:bg-slate-50 px-2 rounded-xl">
                                                    <div>
                                                        <span className="font-bold text-slate-900 text-sm font-jua block">{h.name} <span className="text-xs text-indigo-900 font-normal">({h.symbol})</span></span>
                                                        <span className="text-slate-400 text-[11px] font-jua">{h.category} · 수량: {h.qty}</span>
                                                    </div>
                                                    <div className="text-right font-jua">
                                                        <span className="font-bold text-slate-900 text-sm block font-mono">{h.evalAmount.toLocaleString()}원</span>
                                                        <span className="text-emerald-600 font-black font-mono">+{h.pnlRate}% PnL</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --------------------------------------------------------------------- */}
                            {/* TAB 2: 💡 나의 투자전략 (My Investment Strategies) */}
                            {/* --------------------------------------------------------------------- */}
                            {activeTab === 'strategy' && (
                                <div className="space-y-4 text-xs">
                                    <div className="white-card p-5 rounded-3xl space-y-3 border border-slate-200">
                                        <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                                            <h3 className="font-black text-slate-900 text-sm">💡 나의 투자 원칙 및 비중 전략</h3>
                                            <button className="bg-indigo-900 text-white text-xs px-3 py-1 rounded-xl font-bold">+ 전략 추가</button>
                                        </div>

                                        <div className="space-y-3 pt-1">
                                            {strategies.map(s => (
                                                <div key={s.id} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                                                    <div className="flex justify-between items-center">
                                                        <span className="font-bold text-slate-900 text-sm">{s.name}</span>
                                                        <span className="bg-indigo-100 text-indigo-900 px-2.5 py-0.5 rounded-full font-bold">비중 {s.weight}</span>
                                                    </div>
                                                    <p className="text-slate-600 text-xs">{s.description}</p>
                                                    <div className="flex justify-between items-center text-[11px] text-slate-500 border-t border-slate-200/60 pt-2 font-mono">
                                                        <span>목표 손익률: <strong className="text-emerald-600">{s.targetPnl}</strong></span>
                                                        <span>위험도: <strong className="text-slate-800">{s.risk}</strong></span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --------------------------------------------------------------------- */}
                            {/* TAB 3: 📝 매매기록 / 매매일지 (Trade Journal & Zero UI Input) */}
                            {/* --------------------------------------------------------------------- */}
                            {activeTab === 'journal' && (
                                <div className="space-y-4 text-xs">
                                    {/* ZERO UI Natural Language Prompt Input */}
                                    <div className="white-card p-4 rounded-3xl prompt-shadow border-2 border-indigo-200 space-y-3">
                                        <div className="flex items-center justify-between border-b border-slate-100 pb-2.5">
                                            <div className="flex items-center gap-2">
                                                <span className="text-slate-400 font-bold">🎯 자산선택:</span>
                                                <button type="button" onClick={() => setSelectedCategory('📈 주식')} className={selectedCategory === '📈 주식' ? 'bg-slate-900 text-white px-3 py-1 rounded-xl font-bold' : 'bg-slate-100 text-slate-700 px-3 py-1 rounded-xl font-bold'}>
                                                    📈 주식
                                                </button>
                                                <button type="button" onClick={() => setSelectedCategory('🪙 코인')} className={selectedCategory === '🪙 코인' ? 'bg-slate-900 text-white px-3 py-1 rounded-xl font-bold' : 'bg-slate-100 text-slate-700 px-3 py-1 rounded-xl font-bold'}>
                                                    🪙 코인
                                                </button>
                                            </div>
                                            <button onClick={() => setJournalFormOpen(true)} className="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1 rounded-xl font-bold">
                                                ✏️ 상세 매매일지 작성
                                            </button>
                                        </div>

                                        <form onSubmit={handlePromptSubmit} className="flex items-center gap-2">
                                            <input
                                                type="text"
                                                value={promptText}
                                                onChange={(e) => setPromptText(e.target.value)}
                                                placeholder="예: '$삼성전자 100만원 매수' 또는 '$BTC 50만원 매수'..."
                                                required
                                                className="w-full bg-slate-50 text-slate-900 placeholder-slate-400 text-sm px-5 py-3.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-200"
                                            />
                                            <button type="submit" className="bg-slate-900 hover:bg-slate-800 text-white font-black px-6 py-3.5 rounded-2xl transition text-sm flex items-center gap-1.5 shrink-0 shadow-md">
                                                <span>일지 기록</span>
                                            </button>
                                        </form>
                                    </div>

                                    {/* Trade Logs Table */}
                                    <div className="white-card p-5 rounded-3xl space-y-3 border border-slate-200">
                                        <h3 className="font-black text-slate-900 text-sm border-b border-slate-100 pb-2">
                                            📝 과거 매매일지 히스토리 ({tradeLogs.length})
                                        </h3>
                                        <div className="space-y-3">
                                            {tradeLogs.map(log => (
                                                <div key={log.id} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex items-center gap-2">
                                                            <span className="ticker-badge font-bold">{log.symbol}</span>
                                                            <span className={log.side === 'BUY' ? 'bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[10px]' : 'bg-rose-100 text-rose-800 font-bold px-2 py-0.5 rounded text-[10px]'}>
                                                                {log.side}
                                                            </span>
                                                            <span className="text-slate-400 font-mono text-[11px]">{log.date}</span>
                                                        </div>
                                                        <span className="text-emerald-600 font-black font-mono text-sm">+{log.pnlRate}% PnL</span>
                                                    </div>
                                                    <div className="text-slate-700 text-xs">
                                                        💡 <strong>적용 전략:</strong> {log.strategy}
                                                    </div>
                                                    <div className="text-slate-500 text-[11px] bg-white p-2 rounded-xl border border-slate-200/60">
                                                        🤖 AI 수급 분석: {log.aiAnalysis}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --------------------------------------------------------------------- */}
                            {/* TAB 4: 📈 소셜 피드 & 1클릭 카피 트레이딩 (Social Trading & Copy) */}
                            {/* --------------------------------------------------------------------- */}
                            {activeTab === 'social' && (
                                <div className="space-y-4 text-xs">
                                    <div className="white-card p-5 rounded-3xl space-y-3 border border-slate-200">
                                        <h3 className="font-black text-slate-900 text-sm border-b border-slate-100 pb-2">
                                            📖 실시간 소셜 트레이딩 피드 & 1클릭 카피 트레이딩
                                        </h3>
                                        <div className="space-y-3">
                                            {feed.map(item => (
                                                <div key={item.id} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2.5">
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex items-center gap-2">
                                                            <span className="bg-slate-900 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">{item.badge}</span>
                                                            <span className="font-bold text-slate-900 text-sm">{item.author}</span>
                                                        </div>
                                                        <span className="text-slate-400 text-[10px] font-mono">{item.time}</span>
                                                    </div>

                                                    <div className="flex justify-between items-center">
                                                        <div className="text-slate-900 font-bold text-sm">
                                                            <span className="ticker-badge mr-2">{item.symbol}</span>
                                                            <span>{item.amountKrw.toLocaleString()}원 {item.side}</span>
                                                        </div>
                                                        <span className="text-emerald-600 font-black font-mono text-sm">+{item.pnlRate}% PnL</span>
                                                    </div>

                                                    <div className="text-slate-700 text-xs bg-white p-2.5 rounded-xl border border-slate-200/80">
                                                        💡 전략: {item.strategy}
                                                    </div>

                                                    <div className="flex items-center justify-between pt-1">
                                                        <span className="text-slate-500">👍 응원 {item.likes}</span>
                                                        <button onClick={() => alert(`🚀 ${item.author}님의 매매를 1클릭 카피 트레이딩 완료!`)} className="bg-gradient-to-r from-indigo-900 to-slate-900 text-white px-3 py-1 rounded-xl font-bold flex items-center gap-1 shadow-sm">
                                                            <i className="fa-solid fa-retweet text-sky-400"></i>
                                                            <span>1클릭 카피 트레이딩 ({item.copiedCount})</span>
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Fortune City Buildings Summary Card */}
                                    <div className="white-card p-5 rounded-3xl space-y-3 border border-slate-200">
                                        <h3 className="font-black text-slate-900 text-sm border-b border-slate-100 pb-2">
                                            🏙️ 매매로 건축된 내 포춘시티 투자 건물 ({buildings.length})
                                        </h3>
                                        <div className="grid grid-cols-3 gap-3">
                                            {buildings.map(b => (
                                                <div key={b.id} className="p-3 bg-sky-50 rounded-2xl border border-sky-200 text-center space-y-1">
                                                    <i className={`${b.iconClass} text-2xl`}></i>
                                                    <h4 className="font-bold text-slate-900 text-xs block">{b.name}</h4>
                                                    <span className="text-emerald-600 font-black font-mono text-[11px] block">+{b.pnl}%</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    )}

                    {/* 사용방법 설명 모달 (Onboarding Walkthrough Modal) */}
                    {showGuideModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border border-slate-200 max-h-[90vh] overflow-y-auto">
                                <button onClick={() => setShowGuideModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <div>
                                    <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                                        <span>📖 같이투자 이용 가이드 및 사용방법</span>
                                    </h3>
                                    <p className="text-xs text-slate-500">소셜 트레이딩 게임 플랫폼을 200% 활용하는 4가지 단계</p>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div className="p-3.5 bg-indigo-50 rounded-2xl border border-indigo-200 space-y-1">
                                        <span className="font-bold text-indigo-900 text-sm block">1단계: 1초 간편 소셜 로그인</span>
                                        <p className="text-slate-600">카카오/네이버/구글 1초 로그인으로 내 계정을 연결하고 손익률을 안전하게 보존하세요.</p>
                                    </div>
                                    <div className="p-3.5 bg-sky-50 rounded-2xl border border-sky-200 space-y-1">
                                        <span className="font-bold text-sky-900 text-sm block">2단계: 투자종목 및 투자전략 설정</span>
                                        <p className="text-slate-600">내가 보유한 주식/코인 자산 비중과 가치분석/스캘핑 등 내 원칙을 설정합니다.</p>
                                    </div>
                                    <div className="p-3.5 bg-amber-50 rounded-2xl border border-amber-200 space-y-1">
                                        <span className="font-bold text-amber-900 text-sm block">3단계: 프롬프트 매매일지 작성</span>
                                        <p className="text-slate-600">`$삼성전자 100만원 매수`처럼 자연어로 일지를 작성하면 AI 수급 분석과 함께 저장됩니다.</p>
                                    </div>
                                    <div className="p-3.5 bg-emerald-50 rounded-2xl border border-emerald-200 space-y-1">
                                        <span className="font-bold text-emerald-900 text-sm block">4단계: 1클릭 카피 트레이딩 & 포춘시티</span>
                                        <p className="text-slate-600">검증된 고수의 전략을 1클릭으로 복사하고, 매매할 때마다 나만의 포춘시티 건물이 자라납니다!</p>
                                    </div>
                                </div>

                                <button onClick={() => setShowGuideModal(false)} className="w-full bg-slate-900 text-white font-bold py-3.5 rounded-2xl text-xs shadow-md">
                                    확인하고 시작하기
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 상세 매매 일지 작성 모달 */}
                    {journalFormOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-jua">
                            <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 text-left relative border border-slate-200 max-h-[90vh] overflow-y-auto">
                                <button onClick={() => setJournalFormOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="text-lg font-black text-slate-900">✏️ 상세 매매 기록 양식</h3>
                                <form onSubmit={handleManualJournalSubmit} className="space-y-3 text-xs">
                                    <div>
                                        <label className="text-slate-600 block mb-1">종목명</label>
                                        <input type="text" value={manualSymbol} onChange={(e) => setManualSymbol(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-slate-600 block mb-1">구분</label>
                                            <select value={manualSide} onChange={(e) => setManualSide(e.target.value)} className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl">
                                                <option value="BUY">매수 (BUY)</option>
                                                <option value="SELL">매도 (SELL)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-slate-600 block mb-1">손익률 (% PnL)</label>
                                            <input type="number" step="0.1" value={manualPnl} onChange={(e) => setManualPnl(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-slate-600 block mb-1">금액 (KRW)</label>
                                            <input type="number" value={manualAmount} onChange={(e) => setManualAmount(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl" />
                                        </div>
                                        <div>
                                            <label className="text-slate-600 block mb-1">체결가 (KRW)</label>
                                            <input type="number" value={manualPrice} onChange={(e) => setManualPrice(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-slate-600 block mb-1">투자 전략</label>
                                        <input type="text" value={manualStrategy} onChange={(e) => setManualStrategy(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl" />
                                    </div>
                                    <button type="submit" className="w-full bg-slate-900 text-white font-bold py-3.5 rounded-2xl text-xs shadow-md">
                                        일지 등록 및 +200 EXP 받기
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
